/* ---------- dates (local calendar days) ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=()=>iso(new Date());
const fmtDay=s=>fromIso(s).toLocaleDateString(LANG==="ar"?"ar-SA-u-ca-gregory-nu-arab":"en-US",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>fromIso(s).toLocaleDateString(LANG==="ar"?"ar-SA-u-ca-gregory-nu-arab":"en-US",{day:"numeric",month:"short"});
const fmtTime=ts=>new Date(ts).toLocaleString(LANG==="ar"?"ar-SA-u-ca-gregory-nu-arab":"en-US",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const initials=n=>{const p=String(n).trim().split(/\s+/);return (p[0]?.[0]||"")+(p[1]?.[0]||"")};
const ST={present:{e:"✅",c:"p"},absent:{e:"❌",c:"a"},excused:{e:"🚫",c:"e"}};
const stLabel=s=>s?`${ST[s].e} ${t(s)}`:t("notMarked");

const S={user:null,profile:null,cls:null,students:[],att:{},view:"today",day:todayIso(),forceDay:false,stu:null,stuTab:"att",histF:"all",authMode:"in",recovery:false};

function setLang(l){LANG=l;LS.set("lang",l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.title=`${t("portal")} · ${t("site")}`;render()}
document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";

let toastT;function toast(msg,action){clearTimeout(toastT);document.querySelector(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=`<span style="flex:1">${esc(msg)}</span>`;if(action){const b=document.createElement("button");b.className="link";b.textContent=action.label;b.onclick=()=>{d.remove();action.fn()};d.append(b)}document.body.append(d);toastT=setTimeout(()=>d.remove(),action?6000:2600)}
function errText(e){const m=(e&&(e.message||e.error_description||e.msg))||"";if(/fetch|network|Failed to/i.test(m))return t("errNet");if(/Invalid login/i.test(m))return t("errLogin");if(/not confirmed/i.test(m))return t("errConfirm");if(/provider is not enabled|Unsupported provider/i.test(m))return t("errGoogle");if(/rate|too many/i.test(m))return t("errRate");if(/at least|weak/i.test(m))return t("passShort");return t("errGeneric")}

function sheet(html,onMount){const ov=document.createElement("div");ov.className="ov";ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;ov.addEventListener("click",e=>{if(e.target===ov)ov.remove()});document.body.append(ov);onMount&&onMount(ov.querySelector(".sheet"),()=>ov.remove());return ov}

function header(title,sub,back){return `<header class="hd"><div class="in">${back?`<button class="back" data-act="back" aria-label="${t("back")}">${ic("arrow")}</button>`:""}<h1>${esc(title)}${sub?`<small>${esc(sub)}</small>`:""}</h1><div class="lsw" role="group" aria-label="${t("lang")}"><button data-lang="ar" aria-pressed="${LANG==="ar"}">ع</button><button data-lang="en" aria-pressed="${LANG==="en"}">EN</button></div></div></header>`}
function tabbar(){const tabs=[["today","cal"],["students","users"],["history","hist"],["settings","gear"]];return `<nav class="tb" aria-label="${t("portal")}"><div class="in">${tabs.map(([v,i])=>`<button data-view="${v}" ${S.view===v||(v==="students"&&S.view==="student")?'aria-current="page"':""}>${ic(i)}${t(v)}</button>`).join("")}</div></nav>`}

/* ---------- data ---------- */
async function q(p){const{data,error}=await p;if(error)throw error;return data}
async function loadAll(){
 S.profile=(await q(sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle()))||{id:S.user.id,tour_days:[],tour_off:false};
 let cls=await q(sb.from("classes").select("*").order("created_at"));
 if(!cls.length)cls=[await q(sb.from("classes").insert({name:t("defClass"),off_days:[LANG==="ar"?5:4]}).select().single())];
 S.classes=cls;S.cls=cls.find(c=>c.id===LS.get("teacher.cls",""))||cls[0];
 await loadStudents();
}
async function loadStudents(){S.students=await q(sb.from("students").select("*").eq("class_id",S.cls.id).order("created_at"));await loadAtt()}
async function loadAtt(){const ids=S.students.map(s=>s.id);S.att={};if(!ids.length)return;
 const from=addDays(S.day,-120);const rows=await q(sb.from("attendance").select("student_id,day,status").in("student_id",ids).gte("day",from).order("day"));
 for(const r of rows)(S.att[r.student_id]??={})[r.day]=r.status}
const active=()=>S.students.filter(s=>!s.removed_at);
const isOff=day=>(S.cls?.off_days||[]).includes(fromIso(day).getDay());
/* Flag rule: consecutive class days marked "absent" ending at (or before) the given day. Off days and unmarked days are skipped; anything else breaks the run. */
function absentRun(sid,upTo){const a=S.att[sid]||{};const days=Object.keys(a).filter(d=>d<=upTo&&!isOff(d)).sort().reverse();let n=0;for(const d of days){if(a[d]==="absent")n++;else break}return n}

async function setStatus(sid,status){const prev=S.att[sid]?.[S.day];const next=prev===status?null:status;
 (S.att[sid]??={})[S.day]=next||undefined;if(!next)delete S.att[sid][S.day];renderToday();
 try{if(next)await q(sb.from("attendance").upsert({student_id:sid,day:S.day,status:next,updated_at:new Date().toISOString()},{onConflict:"student_id,day"}));
  else await q(sb.from("attendance").delete().eq("student_id",sid).eq("day",S.day))}
 catch(e){if(prev)S.att[sid][S.day]=prev;else delete S.att[sid][S.day];renderToday();toast(errText(e))}}
async function allPresent(){const todo=active().filter(s=>!S.att[s.id]?.[S.day]);if(!todo.length)return;
 todo.forEach(s=>(S.att[s.id]??={})[S.day]="present");renderToday();
 try{await q(sb.from("attendance").upsert(todo.map(s=>({student_id:s.id,day:S.day,status:"present"})),{onConflict:"student_id,day"}))}catch(e){todo.forEach(s=>delete S.att[s.id][S.day]);renderToday();toast(errText(e))}}

  ${list.map(s=>{const v=S.att[s.id]?.[day];const run=absentRun(s.id,day);return `<div class="st"><div class="av">${esc(initials(s.name))}</div><button class="nm" data-stu="${s.id}">${esc(s.name)}${run>=3?`<small>⚑ ${t("flagged")}</small>`:""}</button>
   <div class="seg" role="group" aria-label="${esc(s.name)}">${["present","absent","excused"].map(k=>`<button class="${ST[k].c}" data-mark="${s.id}" data-st="${k}" aria-pressed="${v===k}" aria-label="${t(k)}" ${fut?"disabled":""}>${ST[k].e}</button>`).join("")}</div></div>`}).join("")}
  ${fut?`<p class="mut" style="text-align:center">${t("future")}</p>`:""}</div>

 <div class="dayhd"><button class="rbtn prev" data-act="prev" aria-label="←">${ic("chev")}</button><div class="d"><b>${esc(fmtDay(day))}</b>${day!==todayIso()?`<button class="link sm" data-act="today">${t("goToday")}</button>`:`<span class="mut sm">${isOff(day)?t("dayOff"):t("today")}</span>`}</div><button class="rbtn next" data-act="next" aria-label="→">${ic("chev")}</button></div>

/* ---------- downloads ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{let s=String(v??"");if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
async function doDownload(kind){
 try{const ids=S.students.map(s=>s.id);const rows=ids.length?await q(sb.from("attendance").select("student_id,day,status,updated_at").in("student_id",ids).order("day")):[];
  const name=id=>S.students.find(s=>s.id===id)?.name||"";
  if(kind==="json"){const log=await q(sb.from("audit_log").select("*").order("at"));download(`teacher-backup-${todayIso()}.json`,JSON.stringify({exported:new Date().toISOString(),class:S.cls,students:S.students,attendance:rows,history:log},null,2),"application/json");return}
  const pick=rows.filter(r=>kind==="all"||r.status===kind||(kind==="absent"&&r.status==="excused"));
  const head=LANG==="ar"?["التاريخ","اليوم","الطالب","الحالة"]:["Date","Day","Student","Status"];
  const lines=[head,...pick.map(r=>[r.day,t("wk")[fromIso(r.day).getDay()],name(r.student_id),t(r.status)])].map(r=>r.map(csvCell).join(","));
  download(`attendance-${kind}-${todayIso()}.csv`,"﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");
 }catch(e){toast(errText(e))}}

/* ---------- tour (first 3 days, skippable, replay in Settings) ---------- */
function showTour(force){const steps=t("tour");let i=0;const icons=["home","users","check","flag","hist"];
 sheet(`<div class="tour" id="tr"></div>`,(el,close)=>{const draw=()=>{el.querySelector("#tr").innerHTML=`<div class="ic">${ic(icons[i])}</div><h2>${esc(steps[i][0])}</h2><p class="mut">${esc(steps[i][1])}</p><div class="dots">${steps.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><div class="row2" style="justify-content:center"><button class="btn" data-tskip>${t("skip")}</button><button class="btn pri" data-tnext>${i===steps.length-1?t("done"):t("next")}</button></div><p class="mut sm" style="margin-top:12px">${t("tourNote")}</p>`;
  el.querySelector("[data-tskip]").onclick=close;el.querySelector("[data-tnext]").onclick=()=>{if(i<steps.length-1){i++;draw()}else close()}};draw()});
 if(!force){const days=S.profile.tour_days||[];const d=todayIso();if(!days.includes(d))sb.from("profiles").update({tour_days:[...days,d]}).eq("id",S.user.id).then(()=>{S.profile.tour_days=[...days,d]})}}
function maybeTour(){const days=S.profile.tour_days||[];const d=todayIso();if(S.profile.tour_off)return;if(days.includes(d)||days.length>=3)return;if(sessionStorage.getItem("tourShown"))return;sessionStorage.setItem("tourShown","1");showTour(false)}

 if(d.remind){const s=S.students.find(x=>x.id===d.remind);s&&remindSheet(s);return}
 if(d.hf){S.histF=d.hf;renderHistory();return}
 if(d.off!==undefined){const i=+d.off;const cur=S.cls.off_days||[];saveClass({off_days:cur.includes(i)?cur.filter(x=>x!==i):[...cur,i].sort()});return}
 if(d.preset){saveClass({off_days:[+d.preset]});return}
 if(d.dl){doDownload(d.dl);return}
 if(d.theme){LS.set("theme",d.theme==="auto"?null:d.theme);if(d.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.theme;renderSettings();return}
 const a=d.act;if(!a)return;
 const stu=S.students.find(x=>x.id===S.stu);
 switch(a){
  case "google":{const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:HOME}});if(error)renderAuth(["bad",errText(error)]);break}
  case "back":S.view="students";render();break;
  case "prev":case "next":S.day=addDays(S.day,a==="prev"?-1:1);S.forceDay=false;renderToday();break;
  case "today":S.day=todayIso();S.forceDay=false;renderToday();break;
  case "force":S.forceDay=true;renderToday();break;
  case "allp":allPresent();break;
  case "addStu":addStudentSheet();break;
  case "removeStu":stu&&removeStudent(stu);break;
  case "renameStu":stu&&renameStudent(stu);break;
  case "saveNote":if(stu){const n=$("#stNote").value.trim();try{const r=await q(sb.from("students").update({note:n||null}).eq("id",stu.id).select().single());Object.assign(stu,r);toast(t("noteSaved"))}catch(err){toast(errText(err))}}break;
  case "saveCls":{const n=$("#cn").value.trim();if(n&&n!==S.cls.name)saveClass({name:n});break}
  case "tour":showTour(true);break;
  case "out":await sb.auth.signOut();break;
  case "delAcc":sheet(`<h2>${t("delQ")}</h2><p class="mut">${t("delBody")}</p><div class="row2"><button class="btn danger" style="flex:1" data-y>${t("delYes")}</button><button class="btn" data-x>${t("cancel")}</button></div>`,(el,close)=>{el.querySelector("[data-x]").onclick=close;el.querySelector("[data-y]").onclick=async()=>{close();const{error}=await sb.rpc("request_account_delete");if(error){toast(errText(error));return}S.pendingDel=new Date().toISOString();render()}});break;
  case "restoreAcc":{const{error}=await sb.rpc("cancel_account_delete");if(error){toast(errText(error));return}S.pendingDel=null;toast(t("accRestored"));boot();break}
 }
});

/* ---------- start ---------- */
let booting=false;
async function boot(){if(booting)return;booting=true;
 try{const{data:{session}}=await sb.auth.getSession();S.user=session?.user||null;
  if(!S.user||S.recovery){render();return}
  app.innerHTML=`<div class="spin"></div>`;
  await loadAll();
  S.pendingDel=S.profile.delete_requested_at||null;
  render();if(!S.pendingDel)maybeTour();
 }catch(e){app.innerHTML=`${header(t("portal"),"")}<main><div class="msg bad">${esc(errText(e))}</div><button class="btn" onclick="location.reload()">↻</button></main>`}
 finally{booting=false}}
sb.auth.onAuthStateChange((ev,session)=>{
 if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.user=session?.user||null;renderAuth();return}
 if(ev==="SIGNED_OUT"){S.user=null;S.view="today";render();return}
 if(ev==="SIGNED_IN"&&(!S.user||S.user.id!==session?.user?.id)){S.user=session.user;setTimeout(boot,0)}
});
document.title=`${t("portal")} · ${t("site")}`;
boot();
</script>
</body>
</html>
