const WM_EN={"الله: هو المألوه المعبود، ذو الألوهية، والعبودية على خلقه أجمعين":"Allah: He is al-Maʾlūh, the One who is worshipped, the Possessor of divinity, to whom all His creation owe worship.","والرب هو المربي جميع عباده بالتدبير وأصناف النعم. وأخص من هذا تربيته لأصفيائه بإصلاح قلوبهم وأرواحهم وأخلاقهم":"Ar-Rabb is the One who nurtures all His servants by managing their affairs and with every kind of blessing. More special than this is His nurturing of His chosen ones, by setting right their hearts, their souls and their character.","الرحمن الرحيم: اسمان دالان على أنه تعالى ذو الرحمة الواسعة العظيمة التي وسعت كل شيء، وعمت كل مخلوق، وكتب الرحمة الكاملة للمتقين المتبعين لأنبيائه ورسله":"Ar-Raḥmān, ar-Raḥīm: two names showing that He, the Exalted, has vast, great mercy that encompasses everything and covers every creature, and that He has written complete mercy for those who fear Him and follow His prophets and messengers.","الملك المالك: الذي له الملك فهو الموصوف بصفة الملك وهي صفات العظمة والكبرياء، والقهر، والتدبير، الذي له التصرف المطلق، في الخلق والأمر والجزاء":"Al-Malik, al-Mālik: the One to whom the dominion belongs. He is described with the attribute of dominion, which is the attributes of greatness, pride, overpowering and management, and He has absolute control over creation, command and recompense.","الحي القيوم كامل الحياة والقائم بنفسه. القيوم لأهل السماوات والأرض القائم بتدبيرهم وأرزاقهم وجميع أحوالهم":"Al-Ḥayy, al-Qayyūm: perfect in life, existing by Himself. Al-Qayyūm for the people of the heavens and the earth, who sees to the management of their affairs, their provision and all their conditions.","الواحد الأحد هو الذي توحّد بجميع الكمالات، وتفرّد بكل كمال، ومجد وجلال، وجمال، وحمد، وحكمة، ورحمة، وغيرها من صفات الكمال فليس له فيها مثيل ولا نظير، ولا مناسب بوجه من الوجوه":"Al-Wāḥid, al-Aḥad is the One who is alone in having every perfection and unique in every perfection: glory, majesty, beauty, praise, wisdom, mercy and the other attributes of perfection. In them He has no like, no equal and nothing comparable in any way.","الصمد: أي الرب الكامل والسيد، العظيم، الذي لم يبق صفة كمال إلا اتصف بها، ووصف بغايتها، وكمالها بحيث لا تحيط الخلائق ببعض تلك الصفات بقلوبهم، ولا تعبر عنها ألسنتهم وهو المصمود إليه، المقصود في جميع الحوائج والنوائب":"Aṣ-Ṣamad: that is, the perfect Lord, the great Master, who has every attribute of perfection, described with it at its highest and most complete, so that creation cannot grasp even some of those attributes with their hearts or express them with their tongues. He is the One turned to, the One sought in every need and hardship.","الخالق، البارئ، المصور، الذي خلق جميع الموجودات وبرأها، وسواها بحكمته، وصورها بحمده وحكمته، وهو لم يزل ولا يزال على هذا الوصف العظيم":"Al-Khāliq, al-Bāriʾ, al-Muṣawwir: the One who created all that exists, brought it into being, proportioned it with His wisdom and shaped it with His praise and wisdom. He has always been and will always be described with this great attribute.","الرزاق لجميع المخلوقات، فما من موجود في العالم العلوي والعالم السفلي إلا متمتع برزقه مغمور بكرمه":"Ar-Razzāq for all creatures: there is nothing in the higher world or the lower world except that it enjoys His provision and is covered by His generosity.","الخبير العليم: هو الذي أحاط علمه بالظواهر، والبواطن، والإسرار، والإعلان، والواجبات، والمستحيلات، والممكنات. وبالعالم العلوي والسفلي، وبالماضي، والحاضر، والمستقبل، فلا يخفى عليه شيء من الأشياء":"Al-Khabīr, al-ʿAlīm: He is the One whose knowledge encompasses the outward and the inward, the secret and the open, what must be, what cannot be and what may be; the higher world and the lower world; the past, the present and the future. Nothing at all is hidden from Him.","الحكيم هو الذي له الحكمة العليا في خلقه وأمره … فلا يخلق شيئاً عبثا، ولا يشرع شيئاً سدى":"Al-Ḥakīm is the One who has the highest wisdom in His creation and His command … He creates nothing in vain and legislates nothing without purpose.","السميع الذي يسمع جميع الأصوات باختلاف اللغات على تفنن الحاجات، فالسر عنده علانية البعيد عنده قريب":"As-Samīʿ: the One who hears all voices, in all their different languages and all their many needs. A secret to Him is open, and the far to Him is near.","البصير الذي أحاط بصره بجميع المبصرات في أقطار الأرض والسماوات":"Al-Baṣīr: the One whose sight encompasses everything that can be seen, in every region of the earth and the heavens.","الحميد في ذاته، وأسمائه، وصفاته، وأفعاله، فله من الأسماء أحسنها، ومن الصفات أكملها، ومن الأفعال أتمها، وأحسنها":"Al-Ḥamīd in His essence, His names, His attributes and His actions. His are the best names, the most perfect attributes and the most complete and best actions.","والمجيد الذي دل على أوصاف العظمة والجلال":"And al-Majīd is the name that shows the attributes of greatness and majesty.","والله تعالى عظيم له كل وصف ومعنى يوجب التعظيم":"And Allah, the Exalted, is ʿAẓīm (Magnificent): He has every attribute and meaning that calls for magnifying Him.","الكبير: الذي له الكبرياء في ذاته، وصفاته وله الكبرياء في قلوب أهل السماء، والأرض":"Al-Kabīr: the One to whom pride and greatness belong, in His essence and His attributes, and to whom greatness belongs in the hearts of the people of the heaven and the earth.","من أسمائه الحسنى (العلي الأعلى) وذلك دال على أن جميع معاني العلو ثابتة لله من كل وجه":"Among His beautiful names are al-ʿAliyy and al-Aʿlā, and this shows that every meaning of highness belongs to Allah in every way.","هذه الأسماء العظيمة معانيها متقاربة فهو تعالى كامل القوة عظيم القدرة شامل العزة":"These great names have close meanings: He, the Exalted, is perfect in strength, great in power and complete in might.","القدوس السلام، أي: المعظم المنزه عن صفات النقص كلها وأن يماثله أحد من الخلق":"Al-ʿAzīz: the One to whom all might belongs: the might of strength, the might of overcoming, and the might of being beyond reach.","العزيز الذي له العزة كلها عزة القوة، وعزة الغلبة وعزة الامتناع":"Al-Quddūs, as-Salām: that is, the Magnified, who is far above every attribute of deficiency, and above anything of creation being like Him.","الجبار بمعنى العلي الأعلى، وبمعنى القهار، وبمعنى الرؤوف، الجبار للقلوب المنكسرة، وللضعيف العاجز، ولمن لاذ به، ولجأ إليه":"Al-Jabbār means the Most High, and means the Overpowering, and means the Most Kind: the One who mends broken hearts, mends the weak and helpless, and mends whoever seeks shelter and refuge in Him.","المتكبر عن السوء، والنقص، والعيوب لعظمته، وكبريائه":"Al-Mutakabbir: far above evil, deficiency and defects, because of His greatness and His supreme majesty.","القدير: كامل القدرة بقدرته أوجد الموجودات، وبقدرته دبرها":"Al-Qadīr: perfect in power. By His power He brought all things into being, and by His power He manages them.","الشهيد أي: المطلع على جميع الأشياء سمع جميع الأصوات خفيها، وجليها وأبصر جميع الموجودات دقيقها، وجليلها صغيرها، وكبيرها، وأحاط علمه بكل شيء الذي شهد لعباده، وعلى عباده بما عملوه":"Ash-Shahīd: that is, the One who sees all things. He hears every voice, hidden and open; He sees everything that exists, fine and large, small and great; His knowledge encompasses everything; and He bears witness for His servants and against them about what they have done.","الرقيب والشهيد من أسمائه الحسنى وهما مترادفان، وكلاهما يدل على إحاطة سمع الله بالمسموعات وبصره بالمبصرات، وعلمه بجميع المعلومات الجليّة والخفية":"Ar-Raqīb and ash-Shahīd are among His beautiful names. They have the same meaning, and both show that Allah's hearing encompasses everything heard, His sight everything seen, and His knowledge everything known, the clear and the hidden.","والرقيب المطلع على ما أكنته الصدور، القائم على كل نفس بما كسبت، الذي حفظ المخلوقات وأجراها على أحسن نظام وأكمل تدبير":"And ar-Raqīb is the One who sees what the hearts conceal, who stands over every soul and what it has earned, who has preserved all creatures and made them run in the best order and the most perfect management.","الحسيب: هو العليم بعباده، كافي المتوكلين، المجازي لعباده بالخير والشر بحسب حكمته وعلمه بدقيق اعمالهم وجليلها":"Al-Ḥasīb: He is the One who fully knows His servants, who is enough for those who rely on Him, and who repays His servants for good and evil, according to His wisdom and His knowledge of their deeds, the small and the great.","الحفيظ: الذي حفظ ما خلقه، وأحاط علمه بما أوجده، وحفظ أولياءه من وقوعهم في الذنوب والهلكات":"Al-Ḥafīẓ: the One who preserves what He created, whose knowledge encompasses what He brought into being, and who protects His close friends from falling into sins and ruin.","أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء":"“You are the First, so there is nothing before You. You are the Last, so there is nothing after You. You are the Manifest, so there is nothing above You. You are the Hidden, so there is nothing beyond You.”","فالأول: يدل على أن كل ما سواه حادث كائن بعد أن لم يكن":"So al-Awwal (the First) shows that everything other than Him was brought into being after it did not exist.","والآخر: يدل على أنه هو الغاية، والصمد الذي تصمد إليه المخلوقات بتأهلها، ورغبتها، ورهبتها، وجميع مطالبها":"And al-Ākhir (the Last) shows that He is the final goal, the One to whom all creatures turn with their worship, their hope, their fear and all their requests.","والظاهر: يدل على عظمة صفاته، واضمحلال كل شيء عند عظمته من ذوات وصفات وعلى علوه":"And aẓ-Ẓāhir (the Manifest) shows the greatness of His attributes, that every being and attribute fades away before His greatness, and it shows His highness.","والباطن: يدل على اطلاعه على السرائر، والضمائر، والخبايا، والخفايا، ودقائق الأشياء، كما يدل على كمال قربه ودنوه":"And al-Bāṭin (the Hidden) shows that He knows the secrets, the thoughts, the hidden and concealed things and the finest details, and it also shows His perfect nearness and closeness.","الحكم العدل الذي يحكم بين عباده في الدنيا، والآخرة بعدله، وقسطه":"Al-Ḥakam, al-ʿAdl: the One who judges between His servants in this world and the Hereafter with His justice and fairness.","فهو الغني بذاته، الذي له الغنى التام المطلق، من جميع الوجوه، والاعتبارات لكماله، وكمال صفاته":"He is al-Ghaniyy by His essence, who has complete and absolute richness in every way and every respect, because of His perfection and the perfection of His attributes.","الشاكر الشكور وهو الذي يشكر القليل من العمل الخالص النقي النافع، ويعفو عن الكثير من الزلل":"Ash-Shākir, ash-Shakūr: the One who appreciates a small deed done sincerely, purely and usefully, and pardons many slips.","فهو المعطي المانع: لا مانع لما أعطى، ولا معطي لما منع":"He is al-Muʿṭī, al-Māniʿ: no one can withhold what He gives, and no one can give what He withholds.","الجواد: يعني أنه تعالى الجواد المطلق الذي عم بجوده جميع الكائنات، وملأها من فضله، وكرمه، ونعمه المتنوعة":"Al-Jawād: meaning that He, the Exalted, is the absolutely Generous, whose generosity covers all that exists, and who has filled it with His bounty, His generosity and His many kinds of blessings.","الكريم: كثير الخير يعم به الشاكر، والكافر":"Al-Karīm: abundant in good, which He extends to the grateful and the ungrateful.","البر الوهاب الكريم الذي شمل الكائنات بأسرها ببره، وهباته، وكرمه":"Al-Barr, al-Wahhāb, al-Karīm: the One who covers all of existence with His goodness, His gifts and His generosity.","الحق: في ذاته، وصفاته، فهو واجب الوجود كامل الصفات والنعوت … فقوله حق، وفعله حق، ولقاؤه حق":"Al-Ḥaqq (the Truth) in His essence and His attributes. His existence is necessary, and He is perfect in His attributes and descriptions … His word is true, His action is true, and meeting Him is true.","اللطيف: الذي لطف علمه حتى أدرك الخفايا، والخبايا، وما احتوت عليه الصدور، وما في الأراضي من خفايا البذور ولطف بأوليائه، وأصفيائه، فيسرهم لليسرى وجنبهم العسرى":"Al-Laṭīf: the One whose knowledge is so subtle that it reaches the hidden and concealed things, what the chests contain and the seeds hidden in the earth; and who is kind to His close friends and chosen ones, so He eases them towards ease and keeps them away from hardship.","الرؤوف أي: شديد الرأفة بعباده فمن رأفته ورحمته بهم أن يتم عليهم نعمته التي ابتدأهم بها":"Ar-Raʾūf: that is, intensely kind to His servants. Part of His kindness and mercy to them is that He completes for them the blessing He began for them.","الحليم الذي له الحلم الكامل، والذي وسع حلمه أهل الكفر، والفسوق، والعصيان، ومنع عقوبته أن تحل بأهل الظلم عاجلاً، فهو يمهلهم ليتوبوا، ولا يهملهم إذا أصروا":"Al-Ḥalīm: the One who has perfect forbearance, whose forbearance extends even to the people of disbelief, sin and disobedience. He holds back His punishment from falling on the wrongdoers right away; He gives them time so that they may repent, and He does not neglect them if they persist.","الكافي عباده جميع ما يحتاجون ويضطرون إليه. الكافي كفاية خاصة من آمن به وتوكل عليه واستمد منه حوائج دينه ودنياه":"Al-Kāfī: who is enough for His servants in all they need and cannot do without. Al-Kāfī in a special way for whoever believes in Him, relies on Him and seeks from Him the needs of their religion and their worldly life.","القريب أي: هو القريب من كل أحد، وقربه نوعان: قرب عام من كل أحد بعلمه، وخبرته، ومراقبته، ومشاهدته، واحاطته وهو أقرب إلى الإنسان من حبل الوريد. وقرب خاص من عابديه، وسائليه، ومجيبيه":"Al-Qarīb: that is, He is near to everyone, and His nearness is of two kinds: a general nearness to everyone, through His knowledge, His awareness, His watching, His seeing and His encompassing, and He is closer to a person than their jugular vein; and a special nearness to those who worship Him, ask Him and respond to Him.","المجيب لدعوة الداعين، وسؤال السائلين، وعباده المستجيبين":"Al-Mujīb: who answers the call of those who call on Him, the requests of those who ask Him, and His servants who respond to Him.","القهار: لجميع العالم العلوي، والسفلي، القهار لكل شيء الذي خضعت له المخلوقات وذلك لعزته وقوته، وكمال اقتداره":"Al-Qahhār: over the whole higher and lower world, al-Qahhār over everything, to whom all creatures submit, because of His might, His strength and His perfect power.","فهو القابض للأرزاق والأرواح والنفوس، والباسط للأرزاق، والرحمة، والقلوب":"He is al-Qābiḍ, who withholds provision and takes souls, and al-Bāsiṭ, who extends provision, mercy and hearts.","العفو الغفور الغفار: الذي لم يزل، ولا يزال بالعفو معروفاً، وبالغفران، والصفح عن عباده موصوفاً":"Al-ʿAfuww, al-Ghafūr, al-Ghaffār: the One who has always been and will always be known for pardon, and described with forgiving and overlooking the faults of His servants.","التواب الذي لم يزل يتوب على التائبين، ويغفر ذنوب المنيبين":"At-Tawwāb: the One who has always been accepting the repentance of those who repent, and forgiving the sins of those who turn back to Him.","الفتاح: الذي يحكم بين عباده، بأحكامه الشرعية، وأحكامه القدرية، وأحكام الجزاء، الذي فتح بلطفه بصائر الصادقين، وفتح قلوبهم لمعرفته، ومحبته، والإنابة إليه، وفتح لعباده أبواب الرحمة والأرزاق المتنوعة":"Al-Fattāḥ: the One who judges between His servants with His legal rulings, His decreed rulings and His rulings of recompense; who by His kindness opens the insight of the truthful, opens their hearts to knowing Him, loving Him and turning to Him, and opens for His servants the doors of mercy and many kinds of provision.","الجميل من له نعوت الحسن والإحسان، فإنه جميل في ذاته، وأسمائه، وصفاته، وأفعاله":"Al-Jamīl: the One who has the qualities of beauty and goodness. He is beautiful in His essence, His names, His attributes and His actions.","وهو الحيي الستير: يحب أهل الحياء، والستر … والرب مع كمال غناه عن الخلق كلهم من كرمه يستحي من هتكه، وفضيحته، وإحلال العقوبة به، فيستره بما يفيض له من أسباب الستر":"And He is al-Ḥayiyy, as-Sitteer: He loves people of modesty and covering … and the Lord, though He is completely free of need of all creation, out of His generosity is too modest to expose a servant, disgrace him and punish him, so He covers him with the means of covering He pours on him.","فالله تعالى رفيق في أفعاله خلق المخلوقات كلها بالتدريج شيئاً فشيئاً بحسب حكمته ورفقه مع أنه قادر على خلقها دفعة واحدة وفي لحظة واحدة":"So Allah, the Exalted, is ar-Rafīq (Gentle) in His actions. He created all creatures gradually, step by step, according to His wisdom and gentleness, even though He is able to create them all at once, in a single moment."};
const WM=[[[[0],"الله: هو المألوه المعبود، ذو الألوهية، والعبودية على خلقه أجمعين",164,164]],[[[0],"والرب هو المربي جميع عباده بالتدبير وأصناف النعم. وأخص من هذا تربيته لأصفيائه بإصلاح قلوبهم وأرواحهم وأخلاقهم",199,199]],[[[0,1],"الرحمن الرحيم: اسمان دالان على أنه تعالى ذو الرحمة الواسعة العظيمة التي وسعت كل شيء، وعمت كل مخلوق، وكتب الرحمة الكاملة للمتقين المتبعين لأنبيائه ورسله",200,200]],[[[0],"الملك المالك: الذي له الملك فهو الموصوف بصفة الملك وهي صفات العظمة والكبرياء، والقهر، والتدبير، الذي له التصرف المطلق، في الخلق والأمر والجزاء",233,234]],[[[0,1],"الحي القيوم كامل الحياة والقائم بنفسه. القيوم لأهل السماوات والأرض القائم بتدبيرهم وأرزاقهم وجميع أحوالهم",191,191]],[[[0,1],"الواحد الأحد هو الذي توحّد بجميع الكمالات، وتفرّد بكل كمال، ومجد وجلال، وجمال، وحمد، وحكمة، ورحمة، وغيرها من صفات الكمال فليس له فيها مثيل ولا نظير، ولا مناسب بوجه من الوجوه",167,167]],[[[0],"الصمد: أي الرب الكامل والسيد، العظيم، الذي لم يبق صفة كمال إلا اتصف بها، ووصف بغايتها، وكمالها بحيث لا تحيط الخلائق ببعض تلك الصفات بقلوبهم، ولا تعبر عنها ألسنتهم وهو المصمود إليه، المقصود في جميع الحوائج والنوائب",212,212]],[[[1,2,3],"الخالق، البارئ، المصور، الذي خلق جميع الموجودات وبرأها، وسواها بحكمته، وصورها بحمده وحكمته، وهو لم يزل ولا يزال على هذا الوصف العظيم",170,170]],[[[0],"الرزاق لجميع المخلوقات، فما من موجود في العالم العلوي والعالم السفلي إلا متمتع برزقه مغمور بكرمه",203,203]],[[[0],"الهادي أي الذي يهدي ويرشد عباده إلى جميع المنافع وإلى دفع المضار، ويعلمهم ما لا يعلمون ويهديهم بهداية التوفيق والتسديد ويلهمهم التقوى ويجعل قلوبهم منيبة إليه منقادة لأمره",242,242]],[[[0,1],"الخبير العليم: هو الذي أحاط علمه بالظواهر، والبواطن، والإسرار، والإعلان، والواجبات، والمستحيلات، والممكنات. وبالعالم العلوي والسفلي، وبالماضي، والحاضر، والمستقبل، فلا يخفى عليه شيء من الأشياء",194,194]],[[[0],"الحكيم هو الذي له الحكمة العليا في خلقه وأمره … فلا يخلق شيئاً عبثا، ولا يشرع شيئاً سدى",186,186]],[[[0],"السميع الذي يسمع جميع الأصوات باختلاف اللغات على تفنن الحاجات، فالسر عنده علانية البعيد عنده قريب",209,209]],[[[0],"البصير الذي أحاط بصره بجميع المبصرات في أقطار الأرض والسماوات",174,174]],[[[0],"الحميد في ذاته، وأسمائه، وصفاته، وأفعاله، فله من الأسماء أحسنها، ومن الصفات أكملها، ومن الأفعال أتمها، وأحسنها",190,190]],[[[0],"والمجيد الذي دل على أوصاف العظمة والجلال",166,166]],[[[0],"والله تعالى عظيم له كل وصف ومعنى يوجب التعظيم",216,216],[[1],"الكبير: الذي له الكبرياء في ذاته، وصفاته وله الكبرياء في قلوب أهل السماء، والأرض",224,224]],[[[0,1],"من أسمائه الحسنى (العلي الأعلى) وذلك دال على أن جميع معاني العلو ثابتة لله من كل وجه",168,168]],[[[0,1],"هذه الأسماء العظيمة معانيها متقاربة فهو تعالى كامل القوة عظيم القدرة شامل العزة",214,214]],[[[0,1],"القدوس السلام، أي: المعظم المنزه عن صفات النقص كلها وأن يماثله أحد من الخلق",208,208]],[[[0],"المؤمن الذي أثنى على نفسه بصفات الكمال، وبكمال الجلال والجمال، الذي أرسل رسله وأنزل كتبه بالآيات، والبراهين وصدق رسله بكل آية وبرهان، يدل على صدقهم وصحة ماجاؤا به",239,239]],[[[0],"المهيمن: المطلع على خفايا الأمور، وخبايا الصدور الذي أحاط بكل شيء علما",239,239]],[[[0],"العزيز الذي له العزة كلها عزة القوة، وعزة الغلبة وعزة الامتناع",214,214]],[[[0],"الجبار بمعنى العلي الأعلى، وبمعنى القهار، وبمعنى الرؤوف، الجبار للقلوب المنكسرة، وللضعيف العاجز، ولمن لاذ به، ولجأ إليه",176,177]],[[[0],"المتكبر عن السوء، والنقص، والعيوب لعظمته، وكبريائه",235,235]],[[[0],"القدير: كامل القدرة بقدرته أوجد الموجودات، وبقدرته دبرها",223,223]],[[[0],"الشهيد أي: المطلع على جميع الأشياء سمع جميع الأصوات خفيها، وجليها وأبصر جميع الموجودات دقيقها، وجليلها صغيرها، وكبيرها، وأحاط علمه بكل شيء الذي شهد لعباده، وعلى عباده بما عملوه",211,211],[[0],"الرقيب والشهيد من أسمائه الحسنى وهما مترادفان، وكلاهما يدل على إحاطة سمع الله بالمسموعات وبصره بالمبصرات، وعلمه بجميع المعلومات الجليّة والخفية",207,207]],[[[0],"الرقيب والشهيد من أسمائه الحسنى وهما مترادفان، وكلاهما يدل على إحاطة سمع الله بالمسموعات وبصره بالمبصرات، وعلمه بجميع المعلومات الجليّة والخفية",207,207],[[0],"والرقيب المطلع على ما أكنته الصدور، القائم على كل نفس بما كسبت، الذي حفظ المخلوقات وأجراها على أحسن نظام وأكمل تدبير",207,207]],[[[0],"الحسيب: هو العليم بعباده، كافي المتوكلين، المجازي لعباده بالخير والشر بحسب حكمته وعلمه بدقيق اعمالهم وجليلها",182,182]],[[[0],"الحفيظ: الذي حفظ ما خلقه، وأحاط علمه بما أوجده، وحفظ أولياءه من وقوعهم في الذنوب والهلكات",182,182]],[[[0],"المحيط بكل شيء علماً، وقدرة، ورحمة، وقهرا",237,237]],[[[0],"الواسع الصفات والنعوت ومتعلقاتها بحيث لا يحصى أحد ثناء عليه، بل هو كما اثنى على نفسه، واسع العظمة، والسلطان، والملك، واسع الفضل، والإحسان عظيم الجود والكرم",242,242]],[[[0],"المقيت الذي أوصل إلى كل موجود مابه يقتات وأوصل إليها أرزاقها وصرفها كيف يشاء بحكمه وحمده",239,239]],[[[0,1,2,3],"أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء",169,169],[[0],"فالأول: يدل على أن كل ما سواه حادث كائن بعد أن لم يكن",169,169],[[1],"والآخر: يدل على أنه هو الغاية، والصمد الذي تصمد إليه المخلوقات بتأهلها، ورغبتها، ورهبتها، وجميع مطالبها",169,169],[[2],"والظاهر: يدل على عظمة صفاته، واضمحلال كل شيء عند عظمته من ذوات وصفات وعلى علوه",170,170],[[3],"والباطن: يدل على اطلاعه على السرائر، والضمائر، والخبايا، والخفايا، ودقائق الأشياء، كما يدل على كمال قربه ودنوه",170,170]],[[[0],"الحكم العدل الذي يحكم بين عباده في الدنيا، والآخرة بعدله، وقسطه",185,185]],[[[0],"فهو الغني بذاته، الذي له الغنى التام المطلق، من جميع الوجوه، والاعتبارات لكماله، وكمال صفاته",219,219]],[[[0,1],"الشاكر الشكور وهو الذي يشكر القليل من العمل الخالص النقي النافع، ويعفو عن الكثير من الزلل",210,210]],[[[0],"فهو المعطي المانع: لا مانع لما أعطى، ولا معطي لما منع",234,234],[[1],"الجواد: يعني أنه تعالى الجواد المطلق الذي عم بجوده جميع الكائنات، وملأها من فضله، وكرمه، ونعمه المتنوعة",181,181]],[[[0],"الكريم: كثير الخير يعم به الشاكر، والكافر",225,225],[[0],"البر الوهاب الكريم الذي شمل الكائنات بأسرها ببره، وهباته، وكرمه",173,173]],[[[0],"الحق: في ذاته، وصفاته، فهو واجب الوجود كامل الصفات والنعوت … فقوله حق، وفعله حق، ولقاؤه حق",184,184]],[[[0],"اللطيف: الذي لطف علمه حتى أدرك الخفايا، والخبايا، وما احتوت عليه الصدور، وما في الأراضي من خفايا البذور ولطف بأوليائه، وأصفيائه، فيسرهم لليسرى وجنبهم العسرى",225,225]],[[[0],"البر الوهاب الكريم الذي شمل الكائنات بأسرها ببره، وهباته، وكرمه",173,173]],[[[0],"الرؤوف أي: شديد الرأفة بعباده فمن رأفته ورحمته بهم أن يتم عليهم نعمته التي ابتدأهم بها",198,198]],[[[0],"الحليم الذي له الحلم الكامل، والذي وسع حلمه أهل الكفر، والفسوق، والعصيان، ومنع عقوبته أن تحل بأهل الظلم عاجلاً، فهو يمهلهم ليتوبوا، ولا يهملهم إذا أصروا",189,189]],[[[0],"الكافي عباده جميع ما يحتاجون ويضطرون إليه. الكافي كفاية خاصة من آمن به وتوكل عليه واستمد منه حوائج دينه ودنياه",224,224]],[[[0],"القريب أي: هو القريب من كل أحد، وقربه نوعان: قرب عام من كل أحد بعلمه، وخبرته، ومراقبته، ومشاهدته، واحاطته وهو أقرب إلى الإنسان من حبل الوريد. وقرب خاص من عابديه، وسائليه، ومجيبيه",222,222]],[[[0],"المجيب لدعوة الداعين، وسؤال السائلين، وعباده المستجيبين",235,235]],[[[0],"القهار: لجميع العالم العلوي، والسفلي، القهار لكل شيء الذي خضعت له المخلوقات وذلك لعزته وقوته، وكمال اقتداره",223,223]],[[[0,1],"فهو القابض للأرزاق والأرواح والنفوس، والباسط للأرزاق، والرحمة، والقلوب",171,171]],[[[0],"البر الوهاب الكريم الذي شمل الكائنات بأسرها ببره، وهباته، وكرمه",173,173]],[[[0,1,2],"العفو الغفور الغفار: الذي لم يزل، ولا يزال بالعفو معروفاً، وبالغفران، والصفح عن عباده موصوفاً",218,218]],[[[0],"التواب الذي لم يزل يتوب على التائبين، ويغفر ذنوب المنيبين",176,176]],[[[0],"الفتاح: الذي يحكم بين عباده، بأحكامه الشرعية، وأحكامه القدرية، وأحكام الجزاء، الذي فتح بلطفه بصائر الصادقين، وفتح قلوبهم لمعرفته، ومحبته، والإنابة إليه، وفتح لعباده أبواب الرحمة والأرزاق المتنوعة",220,221]],[[[0],"ومن أسمائه الحسنى النور فالنور وصفه العظيم، وأسماؤه حسنى، وصفاته أكمل الصفات له تعالى رحمة، وحمد، وحكمة، وهو نور السماوات والأرض الذي نور قلوب العارفين بمعرفته، والإيمان به ونور أفئدتهم بهدايته، وهو الذي أنار السماوات والأرض بالأنوار التي وضعها.",240,240]],[[[0],"الودود هو المحب المحبوب بمعنى واد ومودود فهو الذي يحب أنبياءه ورسله وأتباعهم ويحبونه فهو أحب إليهم من كل شيء قد امتلئت قلوبهم من محبته، ولهجت ألسنتهم بالثناء عليه، وانجذبت أفئدتهم إليه وداً واخلاصاً وإنابة من جميع الوجوه",242,242]],[],[],[],[],[[[0],"الوكيل: المتولي لتدبير خلقه بعلمه وكمال قدرته وشمول حكمته والذي تولى أولياءه فيسرهم لليسرى وجنبهم العسرى وكفاهم الأمور. فمن أتخذه وكيلاً كفاه.",244,244]],[],[],[],[[[0,1],"المقدم والمؤخر من أسمائه الحسنى المزدوجة المتقابلة التي لا يطلق واحد بمفرده على الله إلا مقروناً بالآخر فإن الكمال من اجتماعهما فهو تعالى المقدم لمن شاء والمؤخر لمن شاء بحكمته.",238,238]],[[[0],"الجميل من له نعوت الحسن والإحسان، فإنه جميل في ذاته، وأسمائه، وصفاته، وأفعاله",178,178]],[],[[[0,1],"وهو الحيي الستير: يحب أهل الحياء، والستر … والرب مع كمال غناه عن الخلق كلهم من كرمه يستحي من هتكه، وفضيحته، وإحلال العقوبة به، فيستره بما يفيض له من أسباب الستر",193,193]],[],[[[0],"فالله تعالى رفيق في أفعاله خلق المخلوقات كلها بالتدريج شيئاً فشيئاً بحسب حكمته ورفقه مع أنه قادر على خلقها دفعة واحدة وفي لحظة واحدة",206,206]],[]];

const HW=[["المألوه",["المألوه"],"«الله» اسم ربنا عز وجل؛ لا يسمى به غيره؛ ومعناه: المألوه ـ أي المعبود حبّاً، وتعظيماً.","151168","14",9,"\"Allah\" is the name of our Lord, the Mighty and Majestic; no one else is called by it. Its meaning is: al-Ma'luh, that is, the One worshipped out of love and reverence.","al-Ma'luh (the One who is worshipped)",""],["العبادة",["للعبادة","بالعبادة"],"والعبادة تطلق على شيئين: الأول: التعبد بمعنى التذلل لله- عز وجل- بفعل أوامره واجتناب نواهيه; محبة وتعظيما.","7339","1/14",8,"Worship is used for two things. The first: devotion, meaning humbling oneself before Allah, the Mighty and Majestic, by doing what He commands and avoiding what He forbids, out of love and reverence.","worship ('ibada)",""],["الربوبية",["وربوبيته"],"القسم الأول: توحيد الربوبية: هو إفراد الله -عز وجل- بالخلق، والملك، والتدبير.","7339","1/12",6,"The first kind: the Oneness of Lordship (tawhid al-rububiyya). It is to single out Allah, the Mighty and Majestic, in creating, owning and running all affairs.","Lordship (rububiyya)",""],["الألوهية",["وألوهيته"],"القسم الثاني: توحيد الألوهية: ويقال له: توحيد العبادة باعتبارين; فباعتبار إضافته إلى الله يسمى: توحيد الألوهية، وباعتبار إضافته إلى الخلق يسمى توحيد العبادة. وهو إفراد الله- عز وجل- بالعبادة.","7339","1/14",8,"The second kind: the Oneness of Divinity (tawhid al-uluhiyya). It is also called the Oneness of Worship, from two angles: in relation to Allah it is called the Oneness of Divinity, and in relation to the creation it is called the Oneness of Worship. It is to single out Allah, the Mighty and Majestic, in worship.","Divinity (uluhiyya)",""],["النِّد",["ند"],"أي: تعلمون أنه لا ند له والند بمعنى النظير.","11250","1/129",127,"That is: you know that He has no nidd, and nidd means an equal (a match).","nidd (an equal)",""],["التوحيد",["توحيده"],"وهناك تعريف أعم للتوحيد وهو: \"إفراد الله سبحانه وتعالى بما يختص به\"","11257","39",38,"There is a broader definition of tawhid: \"To single out Allah, Glorified and Exalted, in what belongs to Him alone.\"","tawhid (Oneness)",""],["مثقال ذرة",["مثقال","ذرة"],"{مثقال ذرة} يعني وزن ذرة، والمراد بالذرة: صغار النمل كما هو معروف","151168","287",281,"{mithqala dharra} means the weight of a dharra, and dharra means a small ant, as is well known.","mithqal dharra (the weight of a tiny ant)",""],["يعزب",["يعزب"],"{لَا يَعْزُبُ} يَغِيبُ","150304","32",26,"{la ya'zubu}: is not hidden.","ya'zubu (is hidden from)","من كلام المفسِّر الذي يشرحه الشيخ"],["الحكمة",["الحكمة","حكمته","لحكمته"],"والحكمة: وضع الأشياء مواضعها، وتنزيلها منازلها","10090","186",50,"Wisdom is putting things in their right places, and setting them in their proper positions.","wisdom (hikma)",""],["سُدى",["سدى"],"{أَيَحْسَبُ الْإِنْسَانُ أَنْ يُتْرَكَ سُدًى (٣٦) } [القيامة: ٣٦] ، لا يُؤمَر ولا يُنهى؟","150304","310",304,"{Does man think he will be left suda (without purpose)?} [al-Qiyama: 36], not commanded and not forbidden?","suda (left without purpose)",""],["استوى",["استوى"],"أي علا عليه علواً خاصاً به كما يليق بجلاله وعظمته وهذا عنوان كمال الملك والسلطان.","11257","50",66,"That is, He rose over it with a rising that is special to Him, as befits His Majesty and Greatness, and this is the sign of perfect dominion and authority.","istawa (rose over)",""],["العرش",["العرش"],"والعرش هو الذي استوى عليه الله عز وجل، وهو أعظم المخلوقات وأكبرها وأوسعها","151168","140",134,"The Throne is what Allah, the Mighty and Majestic, rose over, and it is the greatest, biggest and widest of all created things.","the Throne ('arsh)",""],["العلو",["العلو"],"وعلو الله عز وجل نوعان: علو صفة، وعلو ذات، أما علو الصفة: فإن أكمل الصفات لله عز وجل، قال تعالى: {ولله المثل الأعلى} [النحل: ٦٠] . وأما علو الذات: فهو أن الله تعالى فوق عباده مستو على عرشه","151168","159",153,"The highness of Allah, the Mighty and Majestic, is of two kinds: highness of attributes and highness of Self. Highness of attributes: the most perfect attributes belong to Allah, the Mighty and Majestic; Allah says: {And to Allah belongs the highest description} [al-Nahl: 60]. Highness of Self: Allah is above His servants, risen over His Throne.","highness ('uluw)",""],["العزة",["العزة"],"العِزَّة التي وُصِفُ الله تعالى بها تَتضمَّن ثلاثة مَعانِيَ: عِزَّة القَدْر، وعِزَّة القَهْر، وعِزَّة الامْتِناع. أما عِزَّة القَدْر فمَعناها: أنَّ الله عَزَّ وَجلَّ ذو قَدْرٍ عَظيم، وأمَّا عِزَّة القَهْر فمَعناها: أن الله ذو قَهْر عظيمٍ؛ وغلَبة لا يَغلِبه أَحَد، وأمَّا عِزَّة الامتِناع فمَعناه: أنَّ الله يَمتَنِع عليه النَّقْص بوَجْهٍ من الوُجوه، ولا يُمكِن أن يَنالَه نَقْصٌ أبَدًا","150304","61",55,"The might with which Allah describes Himself includes three meanings: might of standing, might of overpowering, and might of being beyond reach. Might of standing means Allah, the Mighty and Majestic, is of immense standing. Might of overpowering means Allah has immense power to overcome, and no one overcomes Him. Might of being beyond reach means no deficiency can reach Allah in any way; no deficiency can ever touch Him.","might ('izza)",""],["الخلائق",["الخليقة","الخلائق"],"\"الخلائق\" : جمع خليقة؛ يشمل كل مخلوق.","11250","2/153",610,"\"al-Khala'iq\" is the plural of khaliqa; it includes every created being.","al-khala'iq (all creatures)",""],["قهّار",["قهار"],"القهار: لجميع العالم العلوي، والسفلي، القهار لكل شيء الذي خضعت له المخلوقات وذلك لعزته وقوته، وكمال اقتداره","10090","223",96,"al-Qahhar: over the whole upper and lower world, al-Qahhar over everything, the One to whom all creatures have submitted, because of His might, His strength and His perfect power.","qahhar (the Overpowering)",""],["التوكل",["المتوكلين"],"والتوكل: هو الاعتماد على الله في جلب المنافع ودفع المضار مع الثقة به وفعل الأسباب النافعة.","7339","1/442",435,"Tawakkul is relying on Allah to bring benefits and to keep away harm, with trust in Him, while taking the beneficial means.","tawakkul (trusting reliance)",""],["القسط",["وقسطه"],"وقوله: {بِالْقِسْطِ} أي: بالعدل.","7339","1/40",33,"And His saying {bil-qist}: that is, with justice.","qist (justice)",""],["الخبير",["الخبير"],"{الْخَبِيرُ} : هو العليم ببواطن الأمور فيكون هذا وصفاً أخص بعد وصف أعم، فنقول: العليم بظواهر الأمور، والخبير ببواطن الأمور","11250","1/190",188,"{al-Khabir} is the One who knows the inner hidden sides of things. So this is a more specific description after a general one; we say: al-'Alim (All-Knowing) of the outward sides of things, and al-Khabir of the inner sides of things.","al-Khabir (the All-Aware)",""],["الرأفة",["الرءوف"],"والرأفة: أشد الرحمة وأرقها.","7339","1/440",433,"Ra'fa is the strongest and most tender mercy.","ra'fa (tender mercy)",""],["الطغيان",["طغيانهم"],"والطغيان: مجاوزة الحد","7339","1/28",21,"Tughyan is going beyond the limit.","tughyan (going beyond the limit)",""],["الصفح",["والصفح"],"والفرق بين العفو والصفح: أن الإنسان قد يعفو ولا يصفح، بل يذكر هذا العدوان وهذه الإساءة … فالصفح أبلغ من مجرد العفو.","11250","1/343",341,"The difference between 'afw (pardon) and safh: a person may pardon but not do safh; rather he still mentions this wrong and this offence … so safh goes further than mere pardon.","safh (turning away from a wrong)",""],["كوني وشرعي",["كونيا","شرعيا"],"وحكم الله إما كوني وإما شرعي: فحكم الله الشرعي ما جاءت به رسله ونزلت به كتبه من شرائع الدين. وحكم الله الكوني: ما قضاه على عباده من الخلق والرزق والحياة والموت ونحو ذلك","11250","1/188",186,"Allah's judgement is either kawni (by His decree in the universe) or shar'i (by His law). Allah's shar'i judgement is what His messengers brought and His books came down with of the laws of the religion. Allah's kawni judgement is what He decrees over His servants of creation, provision, life and death and the like.","kawni and shar'i (by His decree / by His law)",""],["المِنّة",["المنة","منة","والمنة"],"والمنة: العطاء، فالعطاء بلا طلب مكافأة يسمى منة","9725","1/517",508,"Minna is giving: giving without asking for anything back is called minna.","minna (a favour given)",""],["الأولياء",["لأوليائه","أولياءه","ولأوليائه","أوليائه"],"فمن هم الأولياء؟ والجواب: /* Listen plays pre-made audio of each lesson's names, read from the fully vowelled text (audio/01.mp3 … 70.mp3). No in-browser computer voice. */
const AUDIO=Object.fromEntries(DATA.map((_,i)=>[i,`audio/${String(i+1).padStart(2,"0")}.mp3`]));
let speaking=null;
function stopSpeech(){if(speaking){try{speaking.pause()}catch(e){}speaking=null}}
function speak(src){
  const b=$("#listen");
  if(speaking){stopSpeech();$("span",b).textContent=t("listen");return}
  Player.stop();stopSay();
  const a=new Audio(),done=()=>{if(speaking===a)speaking=null;const bb=$("#listen");if(bb)$("span",bb).textContent=t("listen")};a.onended=a.onerror=done;
  speaking=a;$("span",b).textContent=t("stop");
  /* load as a whole file (works offline from the cache; iPhone audio range requests do not) */
  fetch(src).then(r=>r.ok?r.blob():Promise.reject()).then(bl=>{if(speaking!==a)return;a.src=URL.createObjectURL(bl);return a.play()}).catch(done);
}

 put(o){return this.tx("readwrite",s=>s.put(o)).catch(()=>{})},raw(){return this.tx("readonly",s=>s.getAll()).then(a=>a||[]).catch(()=>[])},all(){return this.raw().then(a=>a.filter(r=>!r.gone))},del(id){return this.tx("readwrite",s=>s.delete(id)).catch(()=>{})}};

/* ---------- recently deleted (24 hours) ----------
   Nothing is gone straight away. A deleted recording stays in the database marked "gone"; other things (mistakes,
   a learner, erased progress) are kept in a list. Each can be put back for 24 hours, then it is removed for good.
   Every delete shows a popup with Undo and a way to the Recently deleted list. */
const BIN={H:864e5,
  items(){return LS.get("bin",[]).filter(x=>Date.now()-x.t<this.H)},
  keep(a){LS.set("bin",a.filter(x=>Date.now()-x.t<this.H))},
  add(kind,data){const x={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),kind,data};this.keep([x,...this.items()]);return x.id},
  async purge(){this.keep(this.items());for(const r of await DB.raw())if(r.gone&&Date.now()-r.gone>=this.H)await DB.del(r.id)},
  /* Deleting. Each returns a key that undo() understands. */
  async rec(id,t0){const r=(await DB.raw()).find(x=>x.id===id);if(!r)return null;r.gone=t0||Date.now();await DB.put(r);return"rec:"+id},
  mis(id){const m=MIS.all().find(x=>x.id===id);if(!m)return null;MIS.save(MIS.all().filter(x=>x.id!==id));return"bin:"+this.add("mis",{pid:PID,m})},
  async many(keys){const out=[],t0=Date.now();for(const k of keys){const [kind,id]=k.split(":");const u=kind==="rec"?await this.rec(id,t0):this.mis(id);if(u)out.push(u)}return out},
  async undo(keys){const bin=this.items();for(const k of keys){const [kind,id]=k.split(":");
      if(kind==="rec"){const r=(await DB.raw()).find(x=>x.id===id);if(r){delete r.gone;await DB.put(r)}continue}
      const x=bin.find(y=>y.id===id);if(!x)continue;
      if(x.kind==="mis"){const key="mis."+x.data.pid,a=LS.get(key,[]);if(!a.find(m=>m.id===x.data.m.id))a.push(x.data.m);a.sort((p,q)=>q.t-p.t);LS.set(key,a)}
      else if(x.kind==="misall"){const key="mis."+x.data.pid,a=LS.get(key,[]),ids=new Set(a.map(m=>m.id));LS.set(key,[...a,...x.data.list.filter(m=>!ids.has(m.id))].sort((p,q)=>q.t-p.t))}
      else if(x.kind==="learner"){if(!PROFILES.find(p=>p.id===x.data.p.id)){PROFILES.push(x.data.p);LS.set("profiles",PROFILES)}for(const [k,v] of Object.entries(x.data.ls))try{localStorage.setItem(k,v)}catch(e){}
        for(const r of await DB.raw())if(r.pid===x.data.p.id&&r.gone===x.t){delete r.gone;await DB.put(r)}}
      else if(x.kind==="progress"){LS.set("p."+x.data.pid,x.data.st);LS.set("cur."+x.data.pid,x.data.cur||0);if(x.data.wk)LS.set("wk."+x.data.pid,x.data.wk);if(x.data.pid===PID)loadST()}
      this.keep(this.items().filter(y=>y.id!==id))}},
  /* The popup after every delete. */
  pop(keys,n,after){if(!keys||!keys.length)return;let el=$("#binpop");if(el)el.remove();el=document.createElement("div");el.id="binpop";el.className="binpop";el.setAttribute("role","alert");
    el.innerHTML=`<div class="bt">${ic("trash")}<div><b>${n>1?t("binNDel",{n}):t("binDel")}</b><span>${t("binKeep")}</span></div></div><div class="bb"><button type="button" class="u">${ic("undo")}${t("undoL")}</button><button type="button" class="o">${t("binOpen")}</button><button type="button" class="x" aria-label="${esc(t("closeL"))}">${ic("x")}</button></div>`;
    document.body.appendChild(el);const go=()=>{clearTimeout(this.pt);el.remove()};this.pt=setTimeout(go,8000);
    $(".u",el).onclick=async()=>{go();await this.undo(keys);toast(t("binBack"));after?after():render()};$(".o",el).onclick=()=>{go();this.sheet(after)};$(".x",el).onclick=go},
  /* The Recently deleted list. */
  async sheet(after){await this.purge();const recs=(await DB.raw()).filter(r=>r.gone).sort((a,b)=>b.gone-a.gone),bin=this.items();
    const left=t0=>{const h=Math.max(1,Math.ceil((t0+this.H-Date.now())/36e5));return t("binLeft",{h})};
    const row=(key,title,sub,t0)=>`<div class="binit"><div><b>${title}</b><div class="note">${sub} · ${left(t0)}</div></div><button class="btn out sm" data-undo="${key}">${ic("undo")}${t("restoreL")}</button></div>`;
    const prof=id=>{const p=PROFILES.find(x=>x.id===id);return p&&p.name?esc(p.name):t("learner")};
    const rows=[...recs.map(r=>({t:r.gone,h:row("rec:"+r.id,`${ic("mic")}${t("lessonN")} ${N(r.lesson+1)} · <span lang="ar">${esc(nm(r.lesson))}</span>`,`${t("myRecs")} · ${fmtD(r.date)} · ${fmtT(r.dur||0)}`,r.gone)})),
      ...bin.map(x=>({t:x.t,h:row("bin:"+x.id,x.kind==="mis"?`${ic("rev")}${MIS.title(x.data.m)} · ${t("lessonN")} ${N(x.data.m.i+1)}`:x.kind==="misall"?`${ic("rev")}${t("clearMis")} (${N(x.data.list.length)})`:x.kind==="learner"?`${ic("users")}${x.data.p.name?esc(x.data.p.name):t("learner")}`:`${ic("progress")}${t("resetP")}`,
        x.kind==="mis"?`<span lang="ar">${MIS.line(x.data.m,x.data.m.type==="extra"?"s":"e","r")}</span>`:x.kind==="learner"?t("learners"):prof(x.data.pid),x.t)}))].sort((a,b)=>b.t-a.t);
    $("#shT").textContent=t("binTitle");$("#shX").textContent=t("closeL");const B=$("#shB");
    B.innerHTML=`<p class="note" style="margin:0 0 10px">${t("binD")}</p>${rows.length?`<button class="btn pri sm" id="undoAll" style="margin-bottom:10px">${ic("undo")}${t("restoreAll")} (${N(rows.length)})</button><div class="binl">${rows.map(r=>r.h).join("")}</div>`:`<p class="note">${t("binEmpty")}</p>`}`;
    $("#misSheet").hidden=false;const redo=()=>{(after||render)();this.sheet(after)};
    $$("[data-undo]",B).forEach(b=>b.onclick=async()=>{await this.undo([b.dataset.undo]);toast(t("binBack"));redo()});
    if($("#undoAll"))$("#undoAll").onclick=async()=>{await this.undo($$("[data-undo]",B).map(b=>b.dataset.undo));toast(t("binBack"));redo()}},
  count:async function(){return (await DB.raw()).filter(r=>r.gone&&Date.now()-r.gone<this.H).length+this.items().length},
  /* A small "Recently deleted (n)" button for any list. */
  async link(el,after){if(!el)return;const n=await this.count();el.hidden=!n;el.innerHTML=`${ic("trash")}${t("binTitle")} · ${N(n)}`;el.onclick=()=>this.sheet(after)}};
/* Select several to delete: "Select" adds a tick to each item; one button then deletes them all (they go to Recently deleted). */
function pickable(wrap,redraw){if(!wrap)return;const bar=$(".selbar",wrap);if(!bar)return;const P=wrap._pk||(wrap._pk={on:false,sel:new Set()});P.sel.clear();P.on=false;
  const paint=()=>{wrap.classList.toggle("picking",P.on);$$("[data-pick]",wrap).forEach(x=>x.classList.toggle("picked",P.sel.has(x.dataset.pick)));const n=P.sel.size;
    bar.hidden=!$("[data-pick]",wrap);
    bar.innerHTML=P.on?`<span class="n">${t("nSel",{n})}</span><button type="button" data-s="all">${t("selAll")}</button><button type="button" data-s="del" class="del" ${n?"":"disabled"}>${ic("trash")}${t("delL")}${n?" ("+N(n)+")":""}</button><button type="button" data-s="x">${t("cancel")}</button>`
      :`<button type="button" data-s="on">${ic("check")}${t("selectL")}</button>`};
  bar.onclick=async e=>{const b=e.target.closest("[data-s]");if(!b)return;const k=b.dataset.s;
    if(k==="on")P.on=true;else if(k==="x"){P.on=false;P.sel.clear()}else if(k==="all")$$("[data-pick]",wrap).forEach(x=>P.sel.add(x.dataset.pick));
    else if(k==="del"){const keys=await BIN.many([...P.sel]);P.sel.clear();P.on=false;paint();redraw();BIN.pop(keys,keys.length,redraw);return}paint()};
  if(!wrap._pkL){wrap._pkL=1;wrap.addEventListener("click",e=>{const P=wrap._pk;if(!P.on||e.target.closest(".selbar"))return;const it=e.target.closest("[data-pick]");if(!it)return;e.preventDefault();e.stopPropagation();
    const k=it.dataset.pick;P.sel.has(k)?P.sel.delete(k):P.sel.add(k);it.classList.toggle("picked",P.sel.has(k));const n=$(".selbar .n",wrap),d=$(".selbar .del",wrap);if(n)n.textContent=t("nSel",{n:P.sel.size});if(d){d.disabled=!P.sel.size;d.innerHTML=`${ic("trash")}${t("delL")}${P.sel.size?" ("+N(P.sel.size)+")":""}`}},true)}
  paint()}

/* ---------- backup file (progress + recordings), no account needed ---------- */
const b64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>res("");r.readAsDataURL(blob)});
const unb64=(s,type)=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
async function makeBackup(){const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("asma1."))ls[k]=localStorage.getItem(k)}}catch(e){}
  const recs=[];for(const r of await DB.all()){recs.push({id:r.id,pid:r.pid,lesson:r.lesson,date:r.date,dur:r.dur,type:r.type,data:await b64(r.blob)})}
  return new Blob([JSON.stringify({app:"asma-al-husna",v:1,date:Date.now(),ls,recs})],{type:"application/json"})}
async function restoreBackup(file){let o;try{o=JSON.parse(await file.text())}catch(e){return false}
  if(!o||o.app!=="asma-al-husna"||typeof o.ls!=="object")return false;
  try{Object.keys(localStorage).filter(k=>k.startsWith("asma1.")).forEach(k=>localStorage.removeItem(k));for(const k in o.ls)if(k.startsWith("asma1."))localStorage.setItem(k,o.ls[k])}catch(e){return false}
  for(const r of o.recs||[]){try{await DB.put({id:r.id,pid:r.pid,lesson:r.lesson,date:r.date,dur:r.dur,type:r.type,blob:unb64(r.data,r.type)})}catch(e){}}
  return true}

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dOf=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const wkStart=(back=0)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay()-7*back);return ymd(d)};
function goalN(){const g=LS.get("goal","set1");if(g==="day")return 7;if(g==="custom")return Math.max(1,LS.get("goalN",7));
  let k=dailyPlan().k;if(k<0)k=SETS-1;let n=setRange(k).length;if(g==="set2")n+=k+1<SETS?setRange(k+1).length:0;return n}
function goalLine(){const g=LS.get("goal","set1");return t("goalLine",{g:g==="set1"?t("gSet1"):g==="set2"?t("gSet2"):g==="day"?t("gDay"):t("gLessons",{n:goalN()})})}
const WK={all(){return LS.get("wk."+PID,{})},
  add(i){const a=this.all(),k=wkStart(),w=a[k]||(a[k]={u:[],r:0}),had=w.u.length>=goalN();w.r++;if(!w.u.includes(i))w.u.push(i);
    const ks=Object.keys(a).sort();while(ks.length>26)delete a[ks.shift()];LS.set("wk."+PID,a);
    if(!had&&w.u.length>=goalN())setTimeout(()=>toast(t("wkHit")),1600)},
  sum(back){const k=wkStart(back),w=this.all()[k]||{u:[],r:0},a=dOf(k),z=new Date(a);z.setDate(z.getDate()+7);
    const days=[...Array(7).keys()].map(n=>{const d=new Date(a);d.setDate(d.getDate()+n);return{k:ymd(d),on:!!ST.days[ymd(d)],d}});
    const slips=MIS.all().filter(m=>m.t>=+a&&m.t<+z).length;
    return{k,days,n:days.filter(x=>x.on).length,u:w.u.length,r:w.r,slips}}};
function weekHTML(back){const s=WK.sum(back),p=WK.sum(back+1),g=goalN(),td=today();
  const wd=d=>d.toLocaleDateString(LANG==="ar"?"ar":"en",{weekday:"short"});
  const msg=s.u>=g?t("wkMet"):back===0?(s.u?t("wkLeft",{n:g-s.u}):t("wkNone")):t("wkMissed");
  return`<div class="panel wkp"><div class="row" style="justify-content:space-between"><h3 class="hue2">${ic("cal")}${t("wkSum")}</h3>
    <div class="seg wkseg"><button data-wk="0" class="${back===0?"on":""}">${t("wkThis")}</button><button data-wk="1" class="${back===1?"on":""}">${t("wkLast")}</button></div></div>
    <div class="wkdays">${s.days.map(x=>`<span class="${x.on?"on":""} ${x.k===td?"now":""}" title="${x.k}"><i>${x.on?ic("check"):""}</i><small>${esc(wd(x.d))}</small></span>`).join("")}</div>
    <div class="stats"><div class="stat hue1">${ic("names")}<b>${N(s.u)}</b><span>${t("wkUnits")}</span></div><div class="stat hue3">${ic("cal")}<b>${N(s.n)} / ${N(7)}</b><span>${t("wkDays")}</span></div><div class="stat hue5">${ic("rev")}<b>${N(s.slips)}</b><span>${t("wkSlips")}</span></div></div>
    <div class="wkgoal"><span>${ic("goal")}${t("wkGoal")}</span><span class="prog"><i style="width:${Math.min(100,s.u/g*100)}%"></i></span><b>${N(Math.min(s.u,g))} / ${N(g)}</b></div>
    <p class="note ${s.u>=g?"okn":""}">${esc(msg)}${s.u>p.u&&p.u>0?" "+esc(t("wkUp",{n:s.u-p.u})):""}</p></div>`}
/* Home: last week's summary once, at the start of a new week, only if something was done. */
function lastWeekHTML(){if(LS.get("wkSeen."+PID,"")===wkStart())return"";const s=WK.sum(1);if(!s.u&&!s.n)return"";const g=goalN();
  return`<div class="panel wkp lastwk"><div class="row" style="justify-content:space-between"><h3 class="hue2">${ic("cal")}${t("wkLastH")}</h3><button class="btn sm" id="wkHide">${t("wkHide")}</button></div>
    <div class="stats"><div class="stat hue1">${ic("names")}<b>${N(s.u)}</b><span>${t("wkUnits")}</span></div><div class="stat hue3">${ic("cal")}<b>${N(s.n)} / ${N(7)}</b><span>${t("wkDays")}</span></div><div class="stat hue6">${ic("goal")}<b>${s.u>=g?"✓":N(s.u)+" / "+N(g)}</b><span>${t("wkGoal")}</span></div></div>
    ${LS.get("remind",null)?"":`<a class="note rmask" href="#settings" data-goremind>${ic("bell")}${t("rmAsk")}</a>`}</div>`}
function bindWeek(el){$$("[data-wk]",el).forEach(b=>b.onclick=()=>{$("#wkBox").innerHTML=weekHTML(+b.dataset.wk);bindWeek(el)});
  const h=$("#wkHide",el);if(h)h.onclick=()=>{LS.set("wkSeen."+PID,wkStart());h.closest(".lastwk").remove()};
  $$("[data-goremind]",el).forEach(a=>a.onclick=()=>LS.set("goRemind",true))}
/* Daily reminder: an event that repeats every day, added to the phone's own Calendar from a small file (remind/HHMM.ics).
   Nothing is stored anywhere but this phone, and there is no server. */
const RM_TIMES=[...Array(48).keys()].map(n=>String(n>>1).padStart(2,"0")+(n&1?"30":"00"));
const rmLabel=hm=>new Date(2000,0,1,+hm.slice(0,2),+hm.slice(2)).toLocaleTimeString(LANG==="ar"?"ar":"en",{hour:"numeric",minute:"2-digit"});
function remindHTML(){const on=LS.get("remind",null),pick=on||LS.get("remindT","2000");
  return`<div class="panel" id="remind"><h3 class="hue6">${ic("bell")}${t("rmH")}</h3><p class="note">${t("rmD")}</p>
    <div class="row"><label for="rmT"><b>${t("rmTime")}</b></label><select id="rmT">${RM_TIMES.map(x=>`<option value="${x}" ${x===pick?"selected":""}>${esc(rmLabel(x))}</option>`).join("")}</select>
    <a class="btn pri sm" id="rmAdd" href="remind/${pick}.ics">${ic("bell")}${t("rmAdd")}</a></div><p class="note">${t("rmHow")}</p>
    ${on?`<div class="rmon"><p class="note okn">${esc(t("rmSet",{t:rmLabel(on)}))}</p><p class="note">${t("rmStop")} ${t("rmChange")}</p><button class="btn sm" id="rmOff">${t("rmForget")}</button></div>`:""}</div>`}
function bindRemind(el){const s=$("#rmT",el);if(!s)return;
  s.onchange=()=>{LS.set("remindT",s.value);$("#rmAdd").href=`remind/${s.value}.ics`};
  $("#rmAdd").onclick=()=>{LS.set("remind",s.value);setTimeout(render,1500)};
  const off=$("#rmOff",el);if(off)off.onclick=()=>{LS.set("remind",null);render()}}

/* ---------- settings ---------- */
V.settings=el=>{
  const th=LS.get("theme","system");
  el.innerHTML=`<section class="sec"><div class="wrap narrow stack"><div class="head"><h2>${t("stHead")}</h2></div>
    <div class="panel">
      <div class="setrow"><b>${t("language")}</b><div class="seg"><button data-l="ar" class="${LANG==="ar"?"on":""}">العربية</button><button data-l="en" class="${LANG==="en"?"on":""}">English</button></div></div>
      <div class="setrow"><b>${t("theme")}</b><div class="seg">${["system","light","dark"].map(x=>`<button data-th="${x}" class="${th===x?"on":""}">${t(x)}</button>`).join("")}</div></div>
      <div class="setrow"><label for="fs"><b>${t("size")}</b></label><input id="fs" type="range" min="0.85" max="1.45" step="0.05" value="${LS.get("fs",1)}" style="accent-color:var(--acc)"></div>
      <div class="setrow"><div><b>${t("showEv")}</b><div class="note">${t("showEvD")}</div></div><label class="tog"><input type="checkbox" id="sEv" ${LS.get("showEv",true)?"checked":""}></label></div>
      <div class="setrow"><div><b>${t("wkGoal")}</b><div class="note">${t("wkGoalD")}</div></div><div class="chips">${[["set1","gSet1"],["set2","gSet2"],["day","gDay"],["custom","gCustom"]].map(([v,k])=>`<button class="chip ${LS.get("goal","set1")===v?"on":""}" data-goal="${v}">${t(k)}</button>`).join("")}${LS.get("goal","set1")==="custom"?`<input id="goalN" type="number" min="1" max="70" inputmode="numeric" value="${goalN()}" aria-label="${esc(t("wkGoal"))}" style="width:80px">`:""}</div></div>
      <div class="setrow"><b>${t("target")}</b><div class="chips">${[3,5,7,10,20].map(n=>`<button class="chip ${LS.get("target",5)===n?"on":""}" data-tg="${n}">${N(n)}</button>`).join("")}</div></div>
    </div>
    ${remindHTML()}
    <div class="panel"><h3 class="hue4">${ic("users")}${t("learners")}</h3><p class="note">${t("learnersD")}</p>
      ${PROFILES.map(p=>`<div class="learner"><button class="avb" data-av="${p.id}" aria-expanded="${AvOpen===p.id}" title="${esc(t("pickIcon"))}">${avatar(p,40)}<span class="avedit">${ic("edit")}</span></button><input data-pn="${p.id}" value="${esc(p.name)}" placeholder="${esc(t("name"))}" aria-label="${esc(t("name"))}">
        ${p.id===PID?`<span class="pill memorized">${t("current")}</span>`:`<button class="btn sm" data-use="${p.id}">${t("use")}</button><button class="btn sm warn" data-del="${p.id}">${t("del")}</button>`}</div>${AvOpen===p.id?avPicker(p):""}`).join("")}
      <div class="row"><button class="btn out sm" id="addL">${t("addLearner")}</button></div></div>
    <div class="panel"><h3 class="hue3">${ic("shield")}${t("storage")}</h3><p class="note">${t("storageD")}</p><p class="note" id="pst"></p>
      <div class="row"><button class="btn out sm" id="persist" hidden>${t("persistBtn")}</button><button class="btn pri sm" id="bk">${ic("save")}${t("backup")}</button><button class="btn out sm" id="rsBtn">${ic("upload")}${t("restore")}</button><input type="file" id="rsFile" accept="application/json,.json" hidden><button class="btn out sm" id="binS">${ic("trash")}${t("binTitle")}</button></div><div id="rcf"></div></div>
    ${LS.get("owner",false)?`<div class="panel"><h3 class="hue4">${ic("progress")}${t("ownV")}</h3><p class="note">${t("ownVD")}</p><div class="stats" id="ownv"><p class="note">…</p></div><div class="row"><button class="btn out sm" id="ownR">${ic("refresh")}${t("ownR")}</button><button class="btn sm" id="ownH">${t("ownH")}</button></div></div>`:""}
    <div class="panel"><div class="row"><button class="btn warn" id="rst">${t("resetP")}</button></div><div id="cf"></div></div>
    <p class="note">${t("voiceCr")} <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a></p>
  </div></section>`;
  const showP=async()=>{const on=await persisted();const el=$("#pst");if(!el)return;el.textContent=on?t("persistOn"):t("persistOff")+" "+t("persistWhat");$("#persist").hidden=on};showP();
  if($("#ownv")){const load=async()=>{const box=$("#ownv");box.innerHTML=`<p class="note">…</p>`;
      const get=async k=>{const r=await fetch(`https://${GOAT}.goatcounter.com/counter/${encodeURIComponent(k)}.json`,{cache:"no-store"});if(!r.ok)throw r.status;const d=await r.json();return String(d.count).replace(/[\s,\u202f\u00a0]/g,"")};
      try{const [here,all]=await Promise.all([get(location.pathname),get("TOTAL")]);if(!box.isConnected)return;
        box.innerHTML=`<div class="stat hue4">${ic("home")}<b>${N(+here||0)}</b><span>${t("ownHere")}</span></div><div class="stat hue2">${ic("progress")}<b>${N(+all||0)}</b><span>${t("ownAll")}</span></div>`}
      catch(e){if(box.isConnected)box.innerHTML=`<p class="note">${e===404?t("ownNone"):t("ownErr")}</p>`}};
    load();$("#ownR").onclick=load;$("#ownH").onclick=()=>{LS.set("owner",false);render()}}
  $("#persist").onclick=async()=>{const b=$("#persist");b.disabled=true;const ok=await keepForever();b.disabled=false;
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    const app=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
    const msg=ok?t("persistYes"):ios&&!app?t("persistIOS"):t("persistNo");
    const el=$("#pst");if(el){el.textContent=msg;el.classList.toggle("okn",!!ok);el.classList.toggle("warnn",!ok)}
    toast(t(ok?"persistYesT":"persistNoT"));if(el)el.scrollIntoView({block:"center",behavior:"smooth"});if(ok)b.hidden=true};
  $("#bk").onclick=async()=>{const b=$("#bk");b.disabled=true;b.textContent=t("working");keepForever();const blob=await makeBackup();await saveBlob(blob,`asma-backup-${today()}.json`);b.disabled=false;b.textContent=t("backup")};
  $("#rsBtn").onclick=()=>$("#rsFile").click();$("#binS").onclick=()=>BIN.sheet();
  $("#rsFile").onchange=e=>{const f=e.target.files[0];if(!f)return;$("#rcf").innerHTML=`<div class="confirm"><p class="note" style="color:var(--ink)">${t("restoreQ")}</p><div class="row"><button class="btn warn" id="ry">${t("restore")}</button><button class="btn sm" id="rn">${t("cancel")}</button></div></div>`;
    $("#rn").onclick=()=>{$("#rcf").innerHTML="";e.target.value=""};
    $("#ry").onclick=async()=>{if(await restoreBackup(f)){toast(t("restored"));setTimeout(()=>location.reload(),600)}else{$("#rcf").innerHTML=`<p class="note" style="color:var(--bad)">${t("badFile")}</p>`}e.target.value=""}};
  $$("[data-l]").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;LS.set("lang",LANG);applySettings();render()});
  $$("[data-th]").forEach(b=>b.onclick=()=>{LS.set("theme",b.dataset.th);applySettings();render()});
  $("#sEv").onchange=e=>setEv(e.target.checked);
  $("#fs").oninput=e=>{LS.set("fs",+e.target.value);applySettings()};
  $$("[data-tg]").forEach(b=>b.onclick=()=>{LS.set("target",+b.dataset.tg);render()});
  $$("[data-goal]").forEach(b=>b.onclick=()=>{LS.set("goal",b.dataset.goal);render()});
  if($("#goalN"))$("#goalN").onchange=e=>{LS.set("goalN",Math.max(1,Math.min(70,+e.target.value||7)));render()};
  bindRemind(el);if(location.hash==="#settings"&&LS.get("goRemind",false)){LS.set("goRemind",false);setTimeout(()=>{const r=$("#remind");if(r)r.scrollIntoView({block:"center",behavior:"smooth"})},60)}
  bindAv(el);
  $$("[data-pn]").forEach(inp=>inp.onchange=()=>{PROFILES.find(p=>p.id===inp.dataset.pn).name=inp.value.trim().slice(0,24);LS.set("profiles",PROFILES);render()});
  $$("[data-use]").forEach(b=>b.onclick=()=>{PID=b.dataset.use;LS.set("pid",PID);loadST();Mem.stopLive();Mem.run=false;Q.qs=null;render()});
  $$("[data-del]").forEach(b=>b.onclick=async()=>{const id=b.dataset.del,p=PROFILES.find(x=>x.id===id),ls={};for(const k of ["asma1.p."+id,"asma1.mis."+id,"asma1.cur."+id,"asma1.mq."+id,"asma1.wk."+id,"asma1.wkSeen."+id]){const v=localStorage.getItem(k);if(v!=null)ls[k]=v}
    const bid=BIN.add("learner",{p,ls}),t0=BIN.items().find(x=>x.id===bid).t;PROFILES=PROFILES.filter(p=>p.id!==id);LS.set("profiles",PROFILES);try{Object.keys(ls).forEach(k=>localStorage.removeItem(k))}catch(e){}
    for(const r of await DB.all())if(r.pid===id){r.gone=t0;await DB.put(r)}render();BIN.pop(["bin:"+bid],1)});
  $("#addL").onclick=()=>{const id="p"+Date.now().toString(36);PROFILES.push({id,name:"",color:PROFILES.length});AvOpen=id;LS.set("profiles",PROFILES);PID=id;LS.set("pid",PID);loadST();Mem.stopLive();Mem.run=false;render()};
  $("#rst").onclick=()=>{$("#cf").innerHTML=`<div class="confirm"><p class="note" style="color:var(--ink)">${t("resetQ")}</p><div class="row"><button class="btn warn" id="y">${t("yes")}</button><button class="btn sm" id="n">${t("cancel")}</button></div></div>`;
    $("#y").onclick=()=>{const bid=BIN.add("progress",{pid:PID,st:ST,cur:LS.get("cur."+PID,0),wk:LS.get("wk."+PID,{})});LS.set("wk."+PID,{});ST={p:{},xp:0,days:{},best:{}};saveST();LS.set("cur."+PID,0);render();BIN.pop(["bin:"+bid],1)};$("#n").onclick=()=>$("#cf").innerHTML=""};
};

applySettings();render();
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* the round mic steps aside while the page's own Start buttons are on screen (Home's hero, a Start bar), so there is one clear button */
function tuckFab(){const f=document.getElementById("fab");if(!f)return;const on=[...document.querySelectorAll(".hero .cta,.startbar")].some(c=>{if(!c.offsetParent&&getComputedStyle(c).position!=="fixed")return false;const r=c.getBoundingClientRect();return r.width>0&&r.bottom>0&&r.top<innerHeight});f.classList.toggle("tuck",on)}
addEventListener("scroll",tuckFab,{passive:true});addEventListener("hashchange",()=>setTimeout(tuckFab,80));addEventListener("click",()=>setTimeout(tuckFab,120));setTimeout(tuckFab,300);
</script>
