<style>/* Layout: same family as the Tuhfat al-Atfal site. White pages, one soft green accent, a manuscript frame for the hero
   and for each lesson. Amiri for the names, Scheherazade (book Naskh) for evidence and meaning, IBM Plex Sans Arabic for the interface. */
@font-face{font-family:"Name";src:url(fonts/Amiri-Bold.woff) format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"Book Naskh";src:url(fonts/ScheherazadeNew-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Book Naskh";src:url(fonts/ScheherazadeNew-Bold.woff) format("woff");font-weight:600 800;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-SemiBold.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-Bold.woff) format("woff");font-weight:700 900;font-display:swap}
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --band:#f3f5f2; --ink:#111418; --muted:#5a616b; --line:#e4e7eb;
  --acc:#3f7f55; --acc-ink:#ffffff; --acc-soft:#e8f2eb; --gold:#9a7b3c; --gold-soft:#f6f0e2;
  --ok:#2e7a4f; --ok-soft:#e5f2ea; --bad:#b42318; --bad-soft:#fbeceb; --warn:#8a5a00; --warn-soft:#f8efda;
  --mask:#e8ebef; --cur:#cfe6d6; --empty:#e6e9ed;
  --h1:#3f7f55; --h1s:#e8f2eb; --h2:#1f7a80; --h2s:#e2f2f3; --h3:#3b62a8; --h3s:#e8eef9; --h4:#7a4f9e; --h4s:#f1eaf7; --h5:#b2475d; --h5s:#fbe9ed; --h6:#9a6a1c; --h6s:#f8efdc;
  --font:"Plex Arabic","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --text:"Book Naskh","Traditional Arabic","Geeza Pro",serif; --name:"Name","Amiri","Traditional Arabic",serif;
  --fs:1; --radius:14px; --shadow:0 1px 2px rgba(40,32,20,.05),0 6px 20px rgba(40,32,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#181b1f; --surface-2:#20242a; --band:#1d211e; --ink:#eef0f2; --muted:#a7adb5; --line:#2c3138;
  --acc:#7cc196; --acc-ink:#0f1a13; --acc-soft:#1c2a21; --gold:#d3b26a; --gold-soft:#2b2618;
  --ok:#6fcf98; --ok-soft:#16301f; --bad:#ff8a7e; --bad-soft:#3a1714; --warn:#f2b65a; --warn-soft:#33270f;
  --mask:#2a2f36; --cur:#24452f; --empty:#2a2f36; --h1:#7cc196; --h1s:#1c2a21; --h2:#6cc7cc; --h2s:#14292b; --h3:#8fb0ec; --h3s:#1a2335; --h4:#c4a0e6; --h4s:#271d31; --h5:#f08ea2; --h5s:#341b21; --h6:#e2b766; --h6s:#2f2512; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#181b1f; --surface-2:#20242a; --band:#1d211e; --ink:#eef0f2; --muted:#a7adb5; --line:#2c3138;
  --acc:#7cc196; --acc-ink:#0f1a13; --acc-soft:#1c2a21; --gold:#d3b26a; --gold-soft:#2b2618;
  --ok:#6fcf98; --ok-soft:#16301f; --bad:#ff8a7e; --bad-soft:#3a1714; --warn:#f2b65a; --warn-soft:#33270f;
  --mask:#2a2f36; --cur:#24452f; --empty:#2a2f36; --h1:#7cc196; --h1s:#1c2a21; --h2:#6cc7cc; --h2s:#14292b; --h3:#8fb0ec; --h3s:#1a2335; --h4:#c4a0e6; --h4s:#271d31; --h5:#f08ea2; --h5s:#341b21; --h6:#e2b766; --h6s:#2f2512; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
.hue1{--c:var(--h1);--cs:var(--h1s)}.hue2{--c:var(--h2);--cs:var(--h2s)}.hue3{--c:var(--h3);--cs:var(--h3s)}
.hue4{--c:var(--h4);--cs:var(--h4s)}.hue5{--c:var(--h5);--cs:var(--h5s)}.hue6{--c:var(--h6);--cs:var(--h6s)}
.menu a:nth-child(1) svg{color:var(--h1)}.menu a:nth-child(2) svg{color:var(--h2)}.menu a:nth-child(3) svg{color:var(--h5)}
.menu a:nth-child(4) svg{color:var(--h4)}.menu a:nth-child(5) svg{color:var(--h3)}.menu a:nth-child(6) svg{color:var(--h6)}
.tile[class*=hue],.gcard[class*=hue]{border-top:4px solid var(--c)}
.tile[class*=hue]:hover,.gcard[class*=hue]:hover{border-color:var(--c)}
.tile[class*=hue] .ic,.gcard[class*=hue] .ic{background:var(--cs);color:var(--c)}
.tile[class*=hue] b{color:var(--c)}
.gcard[class*=hue] .gst{color:var(--c)}
.stat[class*=hue]{background:var(--cs)}.stat[class*=hue] svg{color:var(--c)}.stat[class*=hue] b{color:var(--c)}
.setc[class*=hue] .n{background:var(--cs);color:var(--c)}
.setc[class*=hue]{border-inline-start:4px solid var(--c)}
.lesson[class*=hue]:not(.framed){border-top:4px solid var(--c)}
.lesson[class*=hue] .lnum{background:var(--c);color:var(--surface)}
.blk>h4 svg{width:17px;height:17px}
.blk.ev-b>h4{color:var(--h3)}.blk.mn-b>h4{color:var(--h1)}
h3 .i,.ht .i{width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px;color:var(--c,var(--acc))}
.btn .i{width:17px;height:17px}
.pdfp{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-top:18px;border-inline-start:4px solid var(--c)}.pdfp b .i{color:var(--c);width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px}.pdfp .note{margin:4px 0 0}
html.noev .evx{display:none!important}
.evrow{justify-content:center;margin:-4px 0 10px}
.dlx{margin:4px 0 18px;padding-bottom:16px;border-bottom:1px dashed var(--line);display:grid;gap:6px}
#qdl .dlx{margin:16px 0 0;padding:16px 0 0;border-bottom:0;border-top:1px dashed var(--line)}
.dlx p{margin:0;font-family:var(--text);font-weight:400!important;font-size:calc(1.05rem*var(--fs));line-height:2}
.dlx cite{font-style:normal;font-size:.8rem;color:var(--muted);font-family:var(--font)}
.dlx .lb{font-family:var(--font);font-size:.78rem;font-weight:700;color:var(--h3)}
#pst.okn{color:var(--ok);font-weight:600}#pst.warnn{color:var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:10px}
.evsw .i{width:16px;height:16px}.evsw:not(.on){color:var(--muted)}
.orn{display:flex;justify-content:center;gap:10px;margin:2px 0 4px}
.orn i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px}
.orn i:nth-child(1){background:var(--h2)}.orn i:nth-child(2){background:var(--h6)}.orn i:nth-child(3){background:var(--h1)}.orn i:nth-child(4){background:var(--h6)}.orn i:nth-child(5){background:var(--h5)}
.prog.hue i,.prog[class*=hue] i{background:var(--c)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}
svg.i{width:22px;height:22px;flex:none}
.ar{font-family:var(--text)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;height:60px}
.brand.en{font-family:var(--font);font-size:1.15rem;color:var(--acc);white-space:normal;min-width:0}
@media (max-width:700px){.brand.en{font-size:.95rem;line-height:1.25;max-width:12em}}
@media (max-width:430px){.xpchip{display:none!important}.brand.en{font-size:.82rem;max-width:none;flex:1 1 0}}
.brand{text-decoration:none;margin-inline-end:auto;font-family:var(--name);font-size:1.45rem;font-weight:700;line-height:1.2;white-space:nowrap}
.brand small{font-family:var(--font);font-size:.95rem;font-weight:700}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.86rem;text-decoration:none;white-space:nowrap}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.lsw{display:inline-flex;height:40px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.lsw button{border:0;background:none;padding:0 12px;border-radius:999px;font:inherit;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer}
.lsw button.on{background:var(--acc);color:var(--acc-ink)}
@media (max-width:560px){.lsw button{padding:0 9px;font-size:.8rem}}
.hbtn.icon{width:40px;padding:0;justify-content:center}
.xpchip{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--acc)}
.xpchip small{color:var(--muted);font-weight:500}
.pf{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.8rem;font-weight:700}
.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.menu::-webkit-scrollbar{display:none}
.menu a{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.93rem;font-weight:500;color:var(--muted);padding:7px 12px;border-radius:10px}
.menu a svg{width:18px;height:18px}
.menu a:hover{color:var(--ink);background:var(--surface-2)}
.menu a[aria-current="page"]{color:var(--acc);background:var(--acc-soft);font-weight:700}
@media (max-width:560px){.brand small{display:none}.hbtn .lbl{display:none}.hbtn.lang{width:40px;padding:0;justify-content:center}}

/* frame + hero */
.pat{background:var(--band)}
.frame{position:relative;border:1.5px solid var(--acc);outline:1px solid var(--acc);outline-offset:5px;background:var(--bg)}
.frame>i.c{position:absolute;width:12px;height:12px;background:var(--gold);transform:rotate(45deg);z-index:1}
.frame>i.c:nth-of-type(1){top:-8px;left:-8px}.frame>i.c:nth-of-type(2){top:-8px;right:-8px}.frame>i.c:nth-of-type(3){bottom:-8px;left:-8px}.frame>i.c:nth-of-type(4){bottom:-8px;right:-8px}
.hero{padding-block:40px}
.hero .frame{max-width:760px;margin:0 auto;text-align:center;padding:52px 24px 40px;border-radius:2px}
.kicker{font-size:.84rem;font-weight:600;color:var(--gold);letter-spacing:.06em}
html[lang="en"] .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem}
.hero h1{font-family:var(--name);margin:4px 0 6px;font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.6;color:var(--acc)}
.hero .en1{margin:0;font-size:1.05rem;color:var(--muted)}
.hadith{margin:22px auto 0;max-width:560px;font-family:var(--text);font-size:calc(1.3rem*var(--fs));line-height:2}
.hadith small{display:block;font-family:var(--font);font-size:.82rem;color:var(--muted);line-height:1.6}
.lead{margin:18px auto 0;max-width:520px;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;list-style:none;margin:28px auto 0;padding:0;opacity:.8}
.facts li{padding:0 10px;text-align:center;border-inline-start:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.facts li:first-child{border-inline-start:0}
.facts b{color:var(--ink);font-size:.82rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.92rem;text-decoration:none;border-radius:999px;padding:8px 16px;border:1.2px solid transparent;line-height:1.2;min-height:40px;background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.out{border-color:var(--acc);color:var(--acc);background:var(--surface)}
.btn.out:hover{background:var(--acc-soft)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sections */
.sec{padding-block:56px}
@media (max-width:560px){.sec{padding-block:36px}.lesson{padding:24px 18px;gap:20px}.panel{padding:18px}}
.sec+.sec{border-top:1px solid var(--line)}
.head{display:grid;gap:8px;margin-bottom:28px;max-width:720px}
h2{margin:0;font-weight:800;font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.4;text-wrap:balance}
h3{margin:0;font-size:1.02rem;font-weight:700}
.head p{margin:0;color:var(--muted)}
.prose{max-width:680px;font-size:1.03rem;line-height:1.95}
.prose p{margin:0 0 1em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:grid;gap:16px}
.stack{display:grid;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:.86rem;color:var(--muted);margin:0}
.runb{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:16px 18px;margin:0 0 16px;cursor:pointer;text-align:start;color:#fff;font:inherit;background:linear-gradient(120deg,#1b1640,#3b2a6b 55%,#e07a3f);box-shadow:0 6px 18px rgba(40,20,80,.25)}
.runb .lt{font-size:2.2rem;animation:runsw 1.6s ease-in-out infinite;transform-origin:50% 0}@keyframes runsw{50%{transform:rotate(8deg)}}
.runb b{display:block;font-size:1.15rem;color:#ffe08a}.runb span.d{font-size:.88rem;opacity:.9}.runb .go{margin-inline-start:auto;background:#ffd56b;color:#3a2600;border-radius:99px;padding:8px 16px;font-weight:800;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.tile{display:grid;gap:10px;align-content:start;padding:22px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--acc)}
.tile .ic,.gcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.tile span:last-child{color:var(--muted);font-size:.92rem}
.refs{margin:0;padding-inline-start:1.2em;font-family:var(--text);font-size:1.12rem;line-height:1.9}

/* today / stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.stats{gap:8px}.stat{padding:12px 6px}.stat b{font-size:1.15rem}.stat span{font-size:.76rem}}
.stat{background:var(--surface-2);border-radius:12px;padding:16px;display:grid;gap:2px;justify-items:center;text-align:center}
.stat svg{color:var(--acc)}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.84rem;color:var(--muted)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--empty) 0);display:grid;place-items:center}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.2}
.ring b{font-size:1.4rem}
.ring small{font-size:.75rem;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--empty);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days i{width:18px;height:18px;border-radius:4px;background:var(--empty)}
.days i.on{background:var(--acc)}
.days i.today{outline:2px solid var(--gold);outline-offset:1px}

/* chips, segmented */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.9rem;font-weight:600;min-height:36px}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;background:var(--band);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:10px;min-height:40px;padding:4px 10px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.7}
.pill.new{background:var(--surface-2);color:var(--muted)}
.pill.learning{background:var(--gold-soft);color:var(--gold)}
.pill.memorized{background:var(--ok-soft);color:var(--ok)}
.pill.review{background:var(--warn-soft);color:var(--warn)}

/* set cards */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.setc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.setc:hover{border-color:var(--acc)}
.setc .n{grid-row:span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--acc);font-weight:800}
.setc .t{font-weight:700}
.setc .r{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.setc .s{font-family:var(--name);font-size:1.05rem;color:var(--muted);grid-column:2/4;line-height:1.6;direction:rtl;text-align:start}
.setc .prog{grid-column:1/4;margin-top:6px}
.setc.on{border-color:var(--acc);background:var(--acc-soft)}

/* lesson card */
.nmonly{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.nmo{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;min-height:56px;font-family:var(--name);font-size:calc(1.35rem*var(--fs));line-height:1.6;color:inherit;scroll-margin-top:calc(var(--toph,64px) + 76px)}
.nmo small{display:block;font-family:var(--ui,inherit);font-size:.72rem;color:var(--muted)}
.nmo.playing{border-color:var(--acc);background:var(--acc-soft);outline:2px solid var(--acc)}
.gapw{display:inline-block;min-width:3.4em;border-bottom:2px dashed var(--acc);color:var(--acc)}.gapw.right{border-bottom-color:var(--ok);color:var(--ok)}
.lesson.playing{outline:3px solid var(--acc);outline-offset:2px;scroll-margin-top:calc(var(--toph,64px) + 76px)}
.plbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.plbar.on{position:sticky;top:calc(var(--toph,64px) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}.plbar .chip{display:inline-flex;align-items:center;gap:6px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px clamp(20px,5vw,44px);display:grid;gap:24px}
.lesson.framed{border:1.5px solid var(--acc);outline:1px solid var(--acc);outline-offset:4px;border-radius:2px;box-shadow:none;margin:6px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.lnum{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:var(--band);color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 30px;direction:rtl}
.names>div{display:grid;justify-items:center;text-align:center}
.names .nm{font-family:var(--name);font-size:calc(clamp(1.9rem,6vw,2.5rem)*var(--fs));line-height:1.55;font-weight:700}
.names .gl{font-size:.84rem;color:var(--muted);direction:ltr}
.names.hid .nm{color:transparent;background:var(--mask);border-radius:10px;cursor:pointer}
html[lang="ar"] .names .gl{display:none}
.blk{display:grid;gap:12px}
.blk>h4{margin:0;display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.04em}
.blk>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{direction:rtl;text-align:center;display:grid;gap:2px;max-width:34em;margin-inline:auto}
.ev p{margin:0;font-family:var(--text);font-size:calc(1.15rem*var(--fs));line-height:2.1}
.ev cite{font-style:normal;font-size:.82rem;color:var(--muted)}
.mn{direction:rtl;text-align:center;display:grid;gap:10px;max-width:32em;margin-inline:auto}
.mn-en{display:grid;gap:6px;max-width:640px;margin:6px auto 0;padding:12px 16px;border-radius:12px;background:var(--h1s);text-align:start}
.mn-en p{margin:0;font-size:calc(.95rem*var(--fs));line-height:1.75}
.mn-en .trl{font-size:.74rem;font-weight:700;color:var(--h1);letter-spacing:.04em}
.mn p{margin:0;font-family:var(--text);font-weight:600;font-size:calc(1.22rem*var(--fs));line-height:2.1}
.w.h{color:transparent;background:var(--mask);border-radius:6px;cursor:pointer}
.w.fl{cursor:pointer}
.w.fl .rest{color:transparent;background:var(--mask);border-radius:0 6px 6px 0}
.w.cur,.w.cur .rest{background:var(--cur)!important;box-shadow:0 0 0 2px var(--acc)}
/* hands-free recite: read = said while visible, mem = said from memory, miss = skipped */
.w.rd{color:var(--h3);transition:color .2s}
.w.pk{color:var(--h3);text-decoration:underline dotted;text-underline-offset:6px}
.w.wm{color:var(--acc);background:var(--h1s);border-radius:6px;box-shadow:inset 0 -2px 0 var(--acc);transition:background .2s}
.w.miss{color:#c0392b;background:#fbe3e0;border-radius:6px}
html[data-theme=dark] .w.miss{color:#ff9b8f;background:#3a1f1c}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .w.miss{color:#ff9b8f;background:#3a1f1c}}
html[data-theme=dark] .w.miss{color:#ff9b8f;background:#3a1f1c}
.livebar{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.btn.live{font-size:1.05rem;padding:12px 26px;border-radius:999px}
.btn.live.on{background:#c0392b;border-color:#c0392b;color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 9px rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){.btn.live.on{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.86rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend .k-mem{background:var(--h1s);box-shadow:inset 0 -2px 0 var(--acc)}.legend .k-rd{background:var(--h3)}.legend .k-miss{background:#e8a59d}
/* mistakes list (Tarteel style): expected vs recited */
.mis{display:grid;gap:12px}
.misc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:grid;gap:8px}
.misc .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.misc .tag{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700;font-variant-numeric:tabular-nums;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-weight:700}
.misc .mt{font-weight:700;flex:1}
.misc .del{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
.misc .del:hover{color:#c0392b;background:var(--empty)}
.mline{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.mline small{color:var(--muted);font-size:.82rem}
.mline .tx{direction:rtl;text-align:right;font-family:var(--text);font-size:calc(1.12rem*var(--fs));line-height:2}
.mline .tx .g{color:var(--acc);font-weight:700}.mline .tx .r{color:#c0392b;font-weight:700}
html[data-theme=dark] .mline .tx .r{color:#ff9b8f}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .mline .tx .r{color:#ff9b8f}}
html[data-theme=dark] .mline .tx .r{color:#ff9b8f}
.mline.one{grid-template-columns:1fr}
.mday{font-weight:700;color:var(--muted);margin:10px 0 0;font-size:.9rem}
.ordsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.ordsw button{border:0;background:transparent;padding:7px 14px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ordsw button.on{background:var(--acc);color:#fff}
.lfoot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:44px}
.list{display:grid;gap:22px}

/* memorize run */
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mtop .where{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.reps{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;background:var(--band);border-radius:14px;padding:12px 14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.dots i.on{background:var(--acc)}
.tog{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;font-weight:600;color:var(--muted)}
.tog input{width:18px;height:18px;accent-color:var(--acc)}

/* games */
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:start;text-align:start;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.gcard:hover{border-color:var(--acc)}
.gcard .ic{grid-row:span 3}
.gcard b{font-size:1.05rem}
.gcard .d{color:var(--muted);font-size:.9rem;line-height:1.6}
.gcard .gst{font-size:.82rem;font-weight:700;color:var(--acc)}
.gbox{display:grid;gap:16px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ghead .sc{font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.flash{min-height:260px;display:grid;place-items:center;text-align:center;padding:34px clamp(20px,5vw,40px);border-radius:18px;background:var(--surface);border:1.5px solid var(--acc);cursor:pointer;direction:rtl}
.flash .nm{font-family:var(--name);font-size:calc(2.2rem*var(--fs));line-height:1.6;margin-bottom:10px}
.flash p{margin:0;font-family:var(--text);font-weight:600;font-size:calc(1.15rem*var(--fs));line-height:2.05;max-width:30em;margin-inline:auto}
.flash .mlb{display:block;font-family:var(--font);font-size:.78rem;font-weight:700;color:var(--h1);margin-bottom:4px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mem button{min-height:110px;border-radius:14px;border:1px solid var(--line);background:var(--acc);color:transparent;padding:10px;direction:rtl;font-family:var(--text);font-weight:600;font-size:calc(.95rem*var(--fs));line-height:1.75}
.mem button.nmc{font-family:var(--name);font-size:calc(1.3rem*var(--fs))}
.mem button.up{background:var(--surface);color:var(--ink);border-color:var(--acc)}
.mem button.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);cursor:default}
.opts{display:grid;gap:10px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;min-height:52px;direction:rtl;font-family:var(--text);font-weight:600;font-size:calc(1rem*var(--fs));line-height:1.85;text-align:center}
.opts button.nmc{font-family:var(--name);font-size:calc(1.35rem*var(--fs))}
.opts button:hover{border-color:var(--acc)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.prompt{direction:rtl;text-align:center;background:var(--band);border-radius:16px;padding:24px 20px}
.prompt .nm{font-family:var(--name);font-size:calc(2rem*var(--fs));line-height:1.6}
.prompt p{margin:0;font-family:var(--text);font-weight:600;font-size:calc(1.15rem*var(--fs));line-height:2.05}
.built{min-height:70px;direction:rtl;text-align:center;border-bottom:2px dashed var(--line);padding:8px;font-family:var(--text);font-weight:700;font-size:calc(1.4rem*var(--fs));line-height:2}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.pool button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 14px;font-family:var(--text);font-weight:700;font-size:calc(1.25rem*var(--fs));line-height:1.9}
.pool button.nmc{font-family:var(--name);font-size:calc(1.4rem*var(--fs))}
.pool button.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool button:disabled{visibility:hidden}
.timer{height:6px;border-radius:99px;background:var(--empty);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.result{display:grid;gap:12px;justify-items:center;text-align:center;padding:10px}
.result .big{font-size:2.8rem;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.2}
.stars{font-size:1.8rem;letter-spacing:4px;color:var(--gold)}
.misses{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%}
.misses li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:6px}
.misses .nm{font-family:var(--name);font-size:1.3rem}

/* settings */
.setrow{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 16px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
@media (max-width:560px){.setrow{grid-template-columns:minmax(0,1fr)}}
.setrow>*{min-width:0}.setrow .chips,.setrow .seg{flex-wrap:wrap}
.learner{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.avb{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.avb .avedit{position:absolute;inset-inline-end:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--acc)}
.avb .avedit .i{width:12px;height:12px}
.pf .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.avpick{display:grid;gap:12px;padding:14px;margin:6px 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.avprev{display:flex;align-items:center;gap:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:240px;overflow-y:auto}
.emogrid button{height:44px;font-size:1.5rem;border-radius:10px;border:1px solid transparent;background:var(--surface);cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emogrid button:hover{border-color:var(--line)}.emogrid button.on{border-color:var(--acc);background:var(--acc-soft)}
.emoin{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font:inherit}
.learner input{flex:1 1 100px;width:0;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
/* reading bar while reciting on the reading page */
.rbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:66;display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
.rbar[hidden]{display:none}
body.reading .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.rbar .st{display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:700;white-space:nowrap;font-size:.92rem}
.rbar .st i{width:10px;height:10px;border-radius:50%;background:#c0392b;animation:blink 1.4s ease-in-out infinite}
.mbar .r3 .lv.ps{color:var(--muted)}.mbar .r3 .lv.ps i{background:var(--muted);animation:none}
@keyframes blink{50%{opacity:.25}}
.rbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.rbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rbar .stop{background:#c0392b;border-color:#c0392b;color:#fff}
.rbar .cnt{background:#c0392b;color:#fff;border-radius:999px;padding:0 7px;font-size:.8rem}
@media (max-width:430px){.rbar .lbl{display:none}.rbar .st span{display:none}}
body.reading .sec{padding-bottom:110px}

/* ---- calm Memorize screen: slim top bar, lesson, and a small floating bar at the bottom ---- */
body.mdocked .sec.mfocus{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body.mdocked #toast,body.reading #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.mdocked.rqon #toast,body.reading #toast{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
body:has(#mv) .retc{display:none}
.mfocus .mbar{gap:6px;padding:6px 0 8px}
.mfocus .mbar .where{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;line-height:1.15}
.mfocus .mbar .where small{font-weight:600;color:var(--muted)}
.mfocus .mbar .rp{display:flex;gap:4px}.mfocus .mbar .rp i{width:6px;height:6px;border-radius:50%;background:var(--line)}.mfocus .mbar .rp i.on{background:var(--acc)}
.mfocus .mbar .r2{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-height:30px}
.mfocus .mbar .r2 .sp{flex:1}.mfocus .mbar .r2 .note{font-size:.8rem;margin:0}
.mfocus .mbar .r2 .lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;color:#c0392b}.mfocus .mbar .r2 .lv i{width:8px;height:8px;border-radius:50%;background:#c0392b;animation:blink 1.4s infinite}
.mfocus .mbar .r2 .lv.ps{color:var(--muted)}.mfocus .mbar .r2 .lv.ps i{background:var(--muted);animation:none}
.mfocus .mbar .r2 .evsw{flex:none;font-size:.8rem;padding:4px 10px;min-height:30px;display:inline-flex;align-items:center;gap:5px}.mfocus .mbar .r2 .evsw .i{width:15px;height:15px}
/* Recite controls (own design): listening = green with a breathing ring, paused = amber "Continue", red round "Stop all".
   A slim row above them shows what is happening (or "Try again · 2 of 3") with three small helpers. */
@keyframes rbreath{0%{box-shadow:0 0 0 0 rgba(46,157,91,.55)}100%{box-shadow:0 0 0 15px rgba(46,157,91,0)}}
.mdock .mic.on,.mdock .mw .mic.on{background:#2e9d5b!important;animation:rbreath 1.6s ease-out infinite!important}
.mdock .mw .mic.ps{background:#c98a12!important}
.mfocus .mbar .r2 .lv{color:#2e9d5b!important}.mfocus .mbar .r2 .lv i{background:#2e9d5b!important}.mfocus .mbar .r2 .lv.ps{color:#a8730c!important}.mfocus .mbar .r2 .lv.ps i{background:#c98a12!important}
.rbar .st i{background:#2e9d5b!important}
.mdock .dk.stop .i{width:34px;height:34px;padding:8px;border-radius:50%;background:#c0392b;color:#fff;box-sizing:border-box}
.mdock .rq,.rbar .rq{pointer-events:auto;margin:0 auto 8px;width:max-content;max-width:100%;display:flex;align-items:center;gap:5px 6px;flex-wrap:wrap;justify-content:center;padding:5px 8px 7px;border-radius:20px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.10);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.rbar .rq{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);margin:0}
.rq .rs{flex-basis:100%;display:flex;justify-content:center;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:#2e9d5b;padding:1px 8px 0;white-space:nowrap}
.rq .rs i{width:8px;height:8px;border-radius:50%;background:#2e9d5b;animation:blink 1.4s infinite}
.rq .rs.ps{color:#a8730c}.rq .rs.ps i{background:#c98a12;animation:none}
.rq .rs.tr{color:#c0392b}.rq .rs.tr i{background:#c0392b}
.rq button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 9px;font:inherit;font-size:.74rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.rq button .i{width:15px;height:15px}
@keyframes wring{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.w.wring{display:inline-block;animation:wring .45s ease-in-out;outline:2px solid #e8a59d;outline-offset:2px;border-radius:6px}
body.mdocked.rqon .sec.mfocus{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.mdock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.mdock .in{pointer-events:auto;margin:0 auto;width:max-content;max-width:100%;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;border-radius:28px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mdock .dk{position:relative;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:6px 4px;border-radius:16px;cursor:pointer}

.mdock .dk:active{background:var(--band)}
.mdock .dk .cnt{position:absolute;top:0;inset-inline-end:10px;min-width:18px;height:18px;border-radius:9px;background:#c0392b;color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 5px}
.mdock .dk .cnt[hidden]{display:none}
.mdock .dk.stop{color:#c0392b}
.mdock .mw{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 6px}.mdock .mw small{font-size:.72rem;font-weight:700;color:var(--muted)}
.mdock .mic{width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.mdock .mic .i{width:26px;height:26px}.mdock .mic.on{background:#c0392b;animation:pulse 1.6s ease-in-out infinite}
.opts{display:grid;gap:14px}.opts .og{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}.opts .og:first-child{border-top:0;padding-top:0}
.opts h4{margin:0;font-size:.85rem;color:var(--muted)}
.opts .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.opts .chip,.opts .btn{font-family:inherit;font-weight:700;display:inline-flex;flex-direction:row;align-items:center;gap:6px;color:var(--ink)}.opts .btn.pri{color:var(--acc-ink)}.opts .btn.warn{color:var(--warn)}.opts .chip.on{color:var(--acc)}.opts .chip .i,.opts .btn .i{width:17px;height:17px;flex:none}
.seg5{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg5 button{flex:1;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:.78rem;font-weight:700;padding:9px 2px;cursor:pointer}
.seg5 button+button{border-inline-start:1px solid var(--line)}.seg5 button.on{background:var(--acc);color:#fff}
/* return to where you were */
.retc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 8px 22px rgba(0,0,0,.22);animation:up .2s ease-out}

.retc button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.retc .x{padding:7px;opacity:.7}.retc .i{width:17px;height:17px}
/* mistakes card (one at a time) */
.mv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:70;width:min(560px,calc(100vw - 20px));max-height:62vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.22);animation:up .2s ease-out}
body.reading .mv{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body:not(.mdocked):not(.reading) .mv{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.mv .mvh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}.mv .mvh .sp{flex:1}
.mv .mvi{width:30px;height:30px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}.mv .mvi .i{width:18px;height:18px}
.mv .mvh .c{color:var(--muted);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.mv .mvt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:.78rem;font-weight:700;padding:5px 10px;cursor:pointer}
.mv .mvx{border:0;background:var(--band);color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.mv .mvx .i{width:16px;height:16px}
.mv .mvb{overflow:auto;padding:4px 12px 10px;display:grid;gap:10px}
.mv .mvf{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line)}
.mv .mvf button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.85rem;border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.mv .mvf button:disabled{opacity:.35}.mv .mvf button .i{width:16px;height:16px}
.mv .mvf .dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.mv .mvf .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.mv .mvf .dots i.on{background:var(--gold);width:16px;border-radius:4px}

/* recently deleted popup, list, and select-to-delete */
.binpop{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:120;width:min(460px,calc(100vw - 20px));background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 12px 10px;box-shadow:0 14px 34px rgba(0,0,0,.3);display:grid;gap:10px;animation:drop .22s ease-out}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:.3}}
.binpop .bt{display:flex;gap:10px;align-items:flex-start}.binpop .bt .i{width:22px;height:22px;flex:none;margin-top:2px}.binpop .bt b{display:block}.binpop .bt span{font-size:.86rem;opacity:.85}
.binpop .bb{display:flex;gap:8px;align-items:center}.binpop button{border:0;border-radius:999px;font:inherit;font-weight:700;font-size:.86rem;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.binpop .u{background:var(--bg);color:var(--ink)}.binpop .o{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}.binpop .x{margin-inline-start:auto;background:transparent;color:var(--bg);padding:6px}.binpop .i{width:17px;height:17px}
.binl{display:grid;gap:8px}.binit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}.binit>div{flex:1;min-width:0}
.binit b{display:flex;align-items:center;gap:6px}.binit b .i{width:17px;height:17px;flex:none}.binit .note{font-size:.82rem;overflow:hidden;text-overflow:ellipsis}
.binlink{margin-top:10px;display:inline-flex;align-items:center;gap:6px}.binlink[hidden]{display:none}.binlink .i{width:16px;height:16px}
.picking .selbar{position:sticky;top:calc(var(--toph,64px) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
#misSheet .picking .selbar,.sheet .picking .selbar{top:0}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.selbar[hidden]{display:none}
.selbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;font-size:.82rem;padding:6px 12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}.selbar .i{width:15px;height:15px}
.selbar .n{font-weight:700;font-size:.85rem;margin-inline-end:auto}.selbar .del{background:#c0392b;border-color:#c0392b;color:#fff}.selbar .del:disabled{opacity:.4}
.picking [data-pick]{position:relative;padding-inline-start:46px!important;cursor:pointer}.picking [data-pick] *{pointer-events:none}
.picking [data-pick]::before{content:"";position:absolute;inset-inline-start:12px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.picking [data-pick].picked{border-color:#c0392b}.picking [data-pick].picked::before{border-color:#c0392b;background:#c0392b;box-shadow:inset 0 0 0 4px var(--surface)}
.picking .sess:not([open])>.mis{display:none}
/* meaning of each name (tap a name) */
.nsay{border:0;background:none;color:var(--acc);padding:4px 6px;margin-inline-start:4px;vertical-align:middle;border-radius:999px;cursor:pointer}.nsay .i{width:18px;height:18px}.nsay.on{background:var(--h1s)}
.hw{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--acc) 60%,transparent);border-radius:2px}
.hw.on{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.hwc{display:grid;gap:12px}
.hwc .wcard{background:color-mix(in srgb,var(--acc) 9%,var(--surface));border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.hwc .aw{font-family:var(--text);font-size:2.3rem;line-height:1.6;direction:rtl;text-align:center;font-weight:600}
.hwc .em{text-align:center;font-size:.95rem;color:var(--muted)}
.hwc blockquote{margin:4px 0;direction:rtl;text-align:right;font-family:var(--text);font-size:1.25rem;line-height:1.9}
.hwc cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);text-align:start}.hwc cite a{color:var(--acc)}
.hwc .acts{display:flex;gap:8px;flex-wrap:wrap}
.hwl{display:grid}.hwl button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;color:inherit;font:inherit;cursor:pointer}
.hwl button.on{background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:8px}
.hwl .gw{font-family:var(--text);font-size:1.45rem;font-weight:600;color:var(--acc);direction:rtl}.hwl .ge{font-size:.86rem;color:var(--muted)}
.wmhint{margin:2px 0 0;text-align:center;font-size:.8rem;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.wmhint svg{width:14px;height:14px}
.wml{display:grid;gap:10px}
.wmen{margin:2px 0 8px;font-size:.95rem;line-height:1.6}.wmen .trl{display:block;margin-bottom:2px;font-size:.74rem;font-weight:700;color:var(--h1)}
.wmq{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.wmq.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.wmn{font-family:var(--name);font-size:1.35rem;color:var(--acc);direction:rtl}
.wmq blockquote{margin:6px 0;direction:rtl;text-align:right;font-family:var(--text,var(--font));font-size:1.08rem;line-height:1.9}
.wmq cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);text-align:start}
/* mistakes sheet (slides up from the bottom) */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .sh-in{width:100%;max-width:720px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sheet .sh-h h3{margin:0}
.sess{border-top:1px solid var(--line);padding:10px 0}
.sess>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700}
.sess>summary::-webkit-details-marker{display:none}
.sess>summary .tm{display:block;color:var(--muted);font-size:.82rem;font-weight:600}
.sess>summary .chev{margin-inline-start:auto;transition:transform .2s}.sess[open]>summary .chev{transform:rotate(180deg)}
.sess .mis{margin-top:10px}
.misc .pl{border:0;background:transparent;color:var(--acc);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
.misc .pl.on{color:#c0392b}
.mbar{position:sticky;top:calc(var(--toph,64px) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding:8px 0 6px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.mbar .r1{display:flex;align-items:center;gap:8px}
.mbar .where{flex:1;min-width:0;border:0;background:var(--band);border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mbar .ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.mbar .ib:disabled{opacity:.35}
.mbar .mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:1.1rem;cursor:pointer;flex:none}
.mbar .mic.on{background:#c0392b;animation:pulse 1.6s ease-in-out infinite}
.mbar .r2{display:flex;gap:6px;flex-wrap:wrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}.mbar .r2::-webkit-scrollbar{display:none}
.mbar .r2 .chip{flex:none;font-size:.82rem;padding:6px 10px;min-height:0;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.mbar .r2 .chip .i{width:16px;height:16px}
.mini{flex:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.82rem;font-weight:700;padding:6px 10px}
.mbar .r3{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.mbar .r3 .lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#c0392b}.mbar .r3 .lv i{width:8px;height:8px;border-radius:50%;background:#c0392b;animation:blink 1.4s infinite}
.mbar .legend{font-size:.8rem;gap:10px}
.plan{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start;background:var(--surface);border-top:4px solid var(--hc,var(--acc))}
.pc.h1{--hc:var(--h1)}.pc.h2{--hc:var(--h2)}.pc.h4{--hc:var(--h4)}.pc.ok{opacity:.75}
.pc .pt{display:flex;justify-content:space-between;align-items:center;gap:6px}.pc .note{margin:0}
.pc .pl{display:flex;flex-wrap:wrap;gap:4px}.pc .pl span{background:var(--band);border-radius:8px;padding:2px 8px;font-family:var(--text);font-size:.95rem}
.pc .btn{justify-self:start}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:6px 0 10px}
.wk{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:0}
.wk.l1{background:#fbe9e6;border-color:#f3c9c2}.wk.l2{background:#f5c6be;border-color:#eba497}.wk.l3{background:#e88f80;color:#fff;border-color:#e88f80}.wk.l4{background:#c0392b;color:#fff;border-color:#c0392b}
.setc.rest{opacity:.7;cursor:default;border-style:dashed}
.fab{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:65;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.fab .i{width:26px;height:26px}.fab[hidden]{display:none}
@media print{.fab{display:none}}
.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.rec audio{grid-column:1/-1;width:100%;height:40px}
.rec .nmi{font-family:var(--name);font-size:1.1rem}
.btn.recon{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
footer{border-top:1px solid var(--line);background:var(--band)}
footer .wrap{padding-block:36px;display:grid;gap:10px;justify-items:center;text-align:center;font-size:.9rem;color:var(--muted)}
footer a{color:var(--acc);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* weekly summary + reminder */
a.stat{color:inherit;text-decoration:none}
.wkp{display:grid;gap:12px}
.wkseg{flex:none}.wkseg button{min-height:34px;font-size:.82rem}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkdays span{display:grid;justify-items:center;gap:4px}
.wkdays i{width:34px;height:34px;border-radius:50%;background:var(--empty);display:grid;place-items:center;color:var(--acc-ink)}
.wkdays i svg{width:18px;height:18px}
.wkdays .on i{background:var(--acc)}
.wkdays .now i{outline:2px solid var(--gold);outline-offset:2px}
.wkdays small{font-size:.72rem;color:var(--muted)}
.wkgoal{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.wkgoal>span:first-child{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.wkgoal .prog{grid-column:auto;margin:0;height:8px}
.rmask{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;justify-self:start}
.rmon{background:var(--ok-soft);border-radius:12px;padding:12px;display:grid;gap:8px;justify-items:start}
#rmT{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 10px}

/* ===== Tidy layout (2026-10-28), the same on every site: nothing removed, only arranged more calmly =====
   Header: the name, then one capsule holding learner · language · settings.
   Tabs: all six visible at once, icon above a short label, a thin line under the open one.
   Cards: one card style everywhere (soft border, no thick coloured tops), colour stays in the small icon.
   Buttons: one height and shape, the main action filled, the others outlined. */
.top{background:color-mix(in srgb,var(--surface) 90%,transparent)!important;-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}
.top .bar1,.bar1{height:58px!important;gap:8px!important}
.hctl{flex:none;display:inline-flex;align-items:stretch;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.hctl>.hbtn,.hctl>.lsw{height:auto!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;margin:0!important;padding:0 11px!important;min-width:40px;justify-content:center}
.hctl>*+*{border-inline-start:1px solid var(--line)!important}
.hctl>.hbtn:active,.hctl .lsw button:active{background:var(--surface-2)!important}
.hctl .lsw{padding:3px!important;display:inline-flex;gap:2px}
.hctl .lsw button.on{background:var(--acc)!important;color:var(--acc-ink)!important}
.hctl .lsw button{background:none!important;color:var(--ink)!important;padding:0 10px!important;border:0;border-radius:999px!important;font:inherit;font-weight:600;font-size:.84rem!important;cursor:pointer}
.hctl #pfBtn{padding:0 7px!important}
@media (max-width:430px){.xpchip{display:none!important}.hctl #lang svg{display:none}}
.menu{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:0!important;overflow:visible!important;padding:0!important}
.menu a{position:relative;flex-direction:column!important;justify-content:center;align-items:center;gap:3px!important;padding:6px 2px 9px!important;border-radius:0!important;background:none!important;font-size:.7rem!important;font-weight:600!important;color:var(--muted);text-align:center;white-space:nowrap;min-width:0;line-height:1.3}
html[lang="ar"] .menu a{font-size:.76rem!important}
.menu a svg{width:21px!important;height:21px!important}
.menu a:hover{background:none!important;color:var(--ink)}
.menu a[aria-current="page"]{color:var(--acc)!important;background:none!important;font-weight:800!important}
.menu a[aria-current="page"]::after{content:"";position:absolute;bottom:0;inset-inline:26%;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
@media (min-width:700px){.menu a{flex-direction:row!important;gap:7px!important;font-size:.9rem!important;padding:10px 6px 12px!important}html[lang="ar"] .menu a{font-size:.92rem!important}}

/* page openings: title and one line under it, the same spacing on every page */
.head{margin-bottom:22px!important;gap:6px!important}
.head h2,h2{letter-spacing:0}
.head p{font-size:.95rem;line-height:1.7}

const MEAN_EN=[["He is the One who is worshipped (al-maʾlūh), the One who alone deserves worship, with no partner in it."], ["He is the One who nurtures all His servants by managing their affairs and with every kind of blessing. More special than this is His nurturing of His close friends (awliyāʾ), by setting right their hearts, their souls and their character."], ["Ar-Raḥmān: the One with vast mercy that covers all of creation.", "Ar-Raḥīm: the One whose name includes the special mercy He has for His believing servants."], ["That is: all of creation are His possessions and His servants, and they all need Him. No one can leave His dominion."], ["Al-Ḥayy: the One with perfect life, who never dies.", "Al-Qayyūm: the One who stands by Himself and needs no one else, and who sustains everything else, so all of them need Him."], ["The One who is unique in His essence, His attributes, His lordship and His right to be worshipped. He has no partner and no equal, blessed and exalted is He."], ["He is the One whom all creatures turn to in all their needs, their necessities and their situations, because of His absolute perfection in His essence, names, attributes and actions."], ["The Creator of everything, who shaped this creation in the most perfect way and the finest form."], ["The One who takes on the provision of all creatures. Their provision truly comes from Him, and anyone else is only a means."], ["That is: the One who guides and directs His servants to everything that benefits them and to keeping away what harms them.", "This is guidance by showing, pointing out and directing, and guidance by granting success (tawfīq) to do good and helping with it."], ["The One whose knowledge encompasses everything. Not even the weight of an atom on earth or in the heaven escapes His knowledge."], ["The One who has the highest wisdom in what He creates and what He commands. He creates nothing in vain, and legislates nothing without purpose."], ["He, the Exalted, hears all voices in all their different languages, and He hears all who ask, all who call on Him and all who worship Him."], ["The One who sees everything, however fine and small. Nothing on earth or in the heaven is hidden from His sight, and He sees who deserves reward or punishment, according to His wisdom and knowledge."], ["The One to whom all praise belongs, who is praised in His essence, names, attributes and actions."], ["Vast in His attributes and great in them, with many descriptions, all of them noble."], ["The One who is greater than everything, mightier than everything, more majestic and higher."], ["The One who has absolute highness over all creation, in His essence, His rank and His dominance. He, blessed and exalted is He, rose over the Throne, and He is free and far above every defect and shortcoming."], ["Al-Matīn: that is, the One of intense strength.", "Al-Qawiyy: the One whom nothing can defeat, whom no conqueror can overcome, and whose decree no one can turn back."], ["The Perfect, the Glorified, who is free of every attribute of deficiency and safe from every defect."], ["He is the One who confirmed the truth of His messengers with every sign, proof and miracle that shows they are truthful and that what they brought is true. He is also the One who gives safety to the fearful by granting them security, the opposite of making them afraid."], ["The One who sees hidden matters and the secrets of the hearts, whose knowledge encompasses everything. He watches over His creation, their deeds, their provision and their lifespans."], ["The One to whom all might belongs. No creature can ever reach Him or harm Him, all creation submits to Him, and it humbles itself before His greatness."], ["That is: He, blessed and exalted is He, is the Overpowering, high above everything. And with that, He mends the broken-hearted and makes the needy free of need."], ["The One who is far above evil, deficiency and defects, because of His greatness and His supreme majesty."], ["That is: He, blessed and exalted is He, has perfect power. By His power He brought all things into being, by His power He manages them, and by His power He turns the hearts and directs them however He wills and wants."], ["That is: the One who sees all things. He has heard every voice, seen everything that exists, and His knowledge encompasses everything. He bears witness for His servants and against them about what they have done."], ["The One who sees what the hearts hide, who has preserved all creatures and made them run in the best order and the most perfect management."], ["He knows His servants fully, He is enough for those who rely on Him, and He repays His servants for good and for evil, according to His wisdom and His knowledge of their deeds, the small and the great."], ["The One who preserves what He created, who protects His close friends from falling into sins and ruin, and who has recorded the servants' deeds and their reward."], ["He, the Exalted, encompasses His servants: with knowledge, so not even the weight of an atom escapes Him; with power, so nothing on earth or in the heaven can defeat Him; and with dominance, so they cannot escape Him or flee from Him."], ["Vast in attributes and descriptions, so much that no one can fully count His praise. He is as He has praised Himself."], ["The One who has power over everything, who preserves everything, and who keeps account of everything."], ["The Prophet ﷺ explained these names in a complete and clear way. He said:", "“You are the First, so there is nothing before You. You are the Last, so there is nothing after You. You are the Most High (aẓ-Ẓāhir), so there is nothing above You. You are the Most Near (al-Bāṭin), so there is nothing closer than You.” (Muslim 2713)"], ["The One who judges between His servants in this world and the Hereafter with His justice and fairness. He is just in how He manages and decrees things."], ["He is the Rich, in whose hand are the treasures of the heavens and the earth, and the treasures of this world and the Hereafter. He enriches all His creation in a general way, and He enriches His chosen servants with the knowledge of Him and the truths of faith that He pours into their hearts."], ["The One who rewards a small deed and forgives many slips. Whoever draws near to Him with some good deed, Allah draws nearer to him even more."], ["That is: He, blessed and exalted is He, no one can hold back what He gives, and no one can give what He holds back.", "And He, the Exalted, gives a great deal, and His giving covers all that exists."], ["He has abundant good and great benefit, and of everything He has the best and most excellent.", "Al-Akram is the superlative form from karam (generosity), which means abundant good, and no one is more worthy of that than Him, glorified is He."], ["He is the Truth in His essence, His attributes and His names. His word is true, His promise is true, and He establishes the truth even if the criminals hate it."], ["The One who is gentle with His believing servants, who brings them what is good for them through His gentleness and kindness, in ways they do not notice. So it carries the meaning of al-Khabīr (the All-Aware) and the meaning of ar-Raʾūf (the Most Kind)."], ["The One whose goodness, favour and giving cover all of creation. He, the Exalted, has always been and will always be described by goodness and giving, and known for favour and kindness."], ["Raʾfah is the highest level of mercy. In this world it is general for all creation, and in the Hereafter it is for some of them: His believing close friends and His God-fearing servants."], ["The One whose forbearance extends even to the people of disbelief, sin and disobedience. He holds back His punishment from falling on the wrongdoers right away. He gives them time so that they may repent, but He does not neglect them if they insist and continue in their transgression and do not turn back to Him."], ["The One who is enough for His creation, protecting them from every evil, harm and wrong. He, blessed and exalted is He, gives them what is enough for everything they need and cannot do without."], ["He is near to everyone through His knowledge, His power and His encompassing. And He has a special nearness to His believing servants, by granting them success, support and victory."], ["He is the One who answers, a general answering, all who call on Him, whoever they are, wherever they are, and in whatever state they are."], ["The One to whom all creatures submit, humbled before His might, His strength and His perfect power.", "And He is al-Qāhir, who subdues and humbles His creation and holds them as His servants, high above them."], ["That is: He, the Exalted, withholds provision and takes souls, and He extends provision and opens hearts, according to His wisdom and His mercy."], ["He gives gifts, favours and presents in abundance. He grants His servants from His great bounty, sends them blessing after blessing, and gives to them generously."], ["The One who has always been and will always be known for pardon, and described by forgiveness and overlooking the faults of His servants. All of them are in need of His pardon and His forgiveness."], ["The One who guides His servants to repent, makes the ways to repentance easy for them, then accepts it from them and forgives them."], ["The One who judges between His creation and rules between them, giving everyone their due right, and who opens for them the doors of mercy, provision and knowledge."], ["The One who has lit up the hearts of those who know Him with knowledge of Him and faith in Him, and has lit up their hearts with His guidance."], ["The One who loves His prophets, His messengers and their followers, and they love Him, so He is more beloved to them than anything else."], ["That is: He, blessed and exalted is He, is the Guardian of all His creation in a general way, and of His righteous close friends in a special way."], ["The One who has taken on helping His servants and has guaranteed support for His close friends and defending them. The one who is truly helped is whoever Allah helps, since the servants have no helper other than Him."], ["The One who repays and holds to account. Allah, majestic and exalted is He, will gather the first and the last on the Day of Resurrection, then repay them and hold them to account for the deeds they sent ahead in their worldly life: if good, then good; and if evil, then evil."], ["The One who remains after all creation has passed away. Everything other than Him will cease, and everyone besides Him will perish, and He, majestic and exalted is He, is the Ever-Living who does not die."], ["The One who manages the affairs of His creation with His knowledge, His perfect power and His all-embracing wisdom. Whoever takes Him as their trustee, He is enough for them. And He is al-Kafīl, glorified is He, who looks after the affairs of all creatures and guarantees their food and their provision."], ["The One of bounty and blessing, of generosity and honour, of favour and giving."], ["Perfect and holy, free of all deficiencies and defects."], ["The One from whom healing comes: healing of the hearts from doubts, uncertainties and other diseases of the heart, and healing of the bodies from illnesses and harm."], ["This bringing forward and putting back is either in creation (kawnī), such as placing some creatures before others and some after others, or in the religious law (sharʿī), such as how He favoured the prophets over the rest of creation, favoured some of them over others, and favoured some of His servants over others."], ["So Allah, blessed and exalted is He, is beautiful in His essence, His names, His attributes and His actions."], ["He, the Exalted, gives a great deal, His gifts are great, and His kindness is vast. He pours His giving on His servants, and all of them owe Him favour, while no one has any favour over Him."], ["The Generous who is too shy to turn away empty-handed anyone who seeks refuge in Him and calls on Him. And the Forbearing who covers His servants' faults in this world and gives them time to repent, and who covers the believers in the Hereafter, forgives them and has mercy on them."], ["The One who has full control and management of this universe, with no equal. He is the Master, to whom alone obedience must be given, with no partner."], ["So Allah, the Exalted, is gentle in His actions. He created all creatures gradually, step by step, according to His wisdom and gentleness, even though He is able to create them all at once, in a single moment."], ["Al-Witr points to the oneness of Allah, the obligation to single Him out (tawḥīd), and to worship Him alone."]]; /* English translation of each meaning, paragraph by paragraph */
