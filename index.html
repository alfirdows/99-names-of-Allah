<style>/* Layout: same family as the Tuhfat al-Atfal site. White pages, one soft green accent, a manuscript frame for the hero
   and for each lesson. Amiri for the names, Scheherazade (book Naskh) for evidence and meaning, IBM Plex Sans Arabic for the interface. */
@font-face{font-family:"Name";src:url(fonts/Amiri-Bold.woff) format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"Book Naskh";src:url(fonts/ScheherazadeNew-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Book Naskh";src:url(fonts/ScheherazadeNew-Bold.woff) format("woff");font-weight:600 800;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-SemiBold.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/IBMPlexSansArabic-Bold.woff) format("woff");font-weight:700 900;font-display:swap}
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --band:#f3f5f2; --ink:#111418; --muted:#5a616b; --line:#e4e7eb;
  --acc:#3f7f55; --acc-ink:#ffffff; --acc-soft:#e8f2eb; --gold:#9a7b3c; --gold-soft:#f6f0e2;
  --ok:#2e7a4f; --ok-soft:#e5f2ea; --bad:#b42318; --bad-soft:#fbeceb; --warn:#8a5a00; --warn-soft:#f8efda;
  --mask:#e8ebef; --cur:#cfe6d6; --empty:#e6e9ed;
  --h1:#3f7f55; --h1s:#e8f2eb; --h2:#1f7a80; --h2s:#e2f2f3; --h3:#3b62a8; --h3s:#e8eef9; --h4:#7a4f9e; --h4s:#f1eaf7; --h5:#b2475d; --h5s:#fbe9ed; --h6:#9a6a1c; --h6s:#f8efdc;
  --font:"Plex Arabic","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --text:"Book Naskh","Traditional Arabic","Geeza Pro",serif; --name:"Name","Amiri","Traditional Arabic",serif;
  --fs:1; --radius:14px; --shadow:0 1px 2px rgba(40,32,20,.05),0 6px 20px rgba(40,32,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#181b1f; --surface-2:#20242a; --band:#1d211e; --ink:#eef0f2; --muted:#a7adb5; --line:#2c3138;
  --acc:#7cc196; --acc-ink:#0f1a13; --acc-soft:#1c2a21; --gold:#d3b26a; --gold-soft:#2b2618;
  --ok:#6fcf98; --ok-soft:#16301f; --bad:#ff8a7e; --bad-soft:#3a1714; --warn:#f2b65a; --warn-soft:#33270f;
  --mask:#2a2f36; --cur:#24452f; --empty:#2a2f36; --h1:#7cc196; --h1s:#1c2a21; --h2:#6cc7cc; --h2s:#14292b; --h3:#8fb0ec; --h3s:#1a2335; --h4:#c4a0e6; --h4s:#271d31; --h5:#f08ea2; --h5s:#341b21; --h6:#e2b766; --h6s:#2f2512; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#181b1f; --surface-2:#20242a; --band:#1d211e; --ink:#eef0f2; --muted:#a7adb5; --line:#2c3138;
  --acc:#7cc196; --acc-ink:#0f1a13; --acc-soft:#1c2a21; --gold:#d3b26a; --gold-soft:#2b2618;
  --ok:#6fcf98; --ok-soft:#16301f; --bad:#ff8a7e; --bad-soft:#3a1714; --warn:#f2b65a; --warn-soft:#33270f;
  --mask:#2a2f36; --cur:#24452f; --empty:#2a2f36; --h1:#7cc196; --h1s:#1c2a21; --h2:#6cc7cc; --h2s:#14292b; --h3:#8fb0ec; --h3s:#1a2335; --h4:#c4a0e6; --h4s:#271d31; --h5:#f08ea2; --h5s:#341b21; --h6:#e2b766; --h6s:#2f2512; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
.hue1{--c:var(--h1);--cs:var(--h1s)}.hue2{--c:var(--h2);--cs:var(--h2s)}.hue3{--c:var(--h3);--cs:var(--h3s)}
.hue4{--c:var(--h4);--cs:var(--h4s)}.hue5{--c:var(--h5);--cs:var(--h5s)}.hue6{--c:var(--h6);--cs:var(--h6s)}
.menu a:nth-child(1) svg{color:var(--h1)}.menu a:nth-child(2) svg{color:var(--h2)}.menu a:nth-child(3) svg{color:var(--h5)}
.menu a:nth-child(4) svg{color:var(--h4)}.menu a:nth-child(5) svg{color:var(--h3)}.menu a:nth-child(6) svg{color:var(--h6)}
.tile[class*=hue],.gcard[class*=hue]{border-top:4px solid var(--c)}
.tile[class*=hue]:hover,.gcard[class*=hue]:hover{border-color:var(--c)}
.tile[class*=hue] .ic,.gcard[class*=hue] .ic{background:var(--cs);color:var(--c)}
.tile[class*=hue] b{color:var(--c)}
.gcard[class*=hue] .gst{color:var(--c)}
.stat[class*=hue]{background:var(--cs)}.stat[class*=hue] svg{color:var(--c)}.stat[class*=hue] b{color:var(--c)}
.setc[class*=hue] .n{background:var(--cs);color:var(--c)}
.setc[class*=hue]{border-inline-start:4px solid var(--c)}
.lesson[class*=hue]:not(.framed){border-top:4px solid var(--c)}
.lesson[class*=hue] .lnum{background:var(--c);color:var(--surface)}
.blk>h4 svg{width:17px;height:17px}
.blk.ev-b>h4{color:var(--h3)}.blk.mn-b>h4{color:var(--h1)}
h3 .i,.ht .i{width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px;color:var(--c,var(--acc))}
.btn .i{width:17px;height:17px}
.pdfp{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-top:18px;border-inline-start:4px solid var(--c)}.pdfp b .i{color:var(--c);width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px}.pdfp .note{margin:4px 0 0}
html.noev .evx{display:none!important}
.evrow{justify-content:center;margin:-4px 0 10px}
.dlx{margin:4px 0 18px;padding-bottom:16px;border-bottom:1px dashed var(--line);display:grid;gap:6px}
#qdl .dlx{margin:16px 0 0;padding:16px 0 0;border-bottom:0;border-top:1px dashed var(--line)}
.dlx p{margin:0;font-family:var(--text);font-weight:400!important;font-size:calc(1.05rem*var(--fs));line-height:2}
.dlx cite{font-style:normal;font-size:.8rem;color:var(--muted);font-family:var(--font)}
.dlx .lb{font-family:var(--font);font-size:.78rem;font-weight:700;color:var(--h3)}
#pst.okn{color:var(--ok);font-weight:600}#pst.warnn{color:var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:10px}
.evsw .i{width:16px;height:16px}.evsw:not(.on){color:var(--muted)}
.orn{display:flex;justify-content:center;gap:10px;margin:2px 0 4px}
.orn i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px}
.orn i:nth-child(1){background:var(--h2)}.orn i:nth-child(2){background:var(--h6)}.orn i:nth-child(3){background:var(--h1)}.orn i:nth-child(4){background:var(--h6)}.orn i:nth-child(5){background:var(--h5)}
.prog.hue i,.prog[class*=hue] i{background:var(--c)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}
svg.i{width:22px;height:22px;flex:none}
.ar{font-family:var(--text)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;height:60px}
.brand.en{font-family:var(--font);font-size:1.15rem;color:var(--acc);white-space:normal;min-width:0}
@media (max-width:700px){.brand.en{font-size:.95rem;line-height:1.25;max-width:12em}}
@media (max-width:430px){.xpchip{display:none!important}.brand.en{font-size:.82rem;max-width:none;flex:1 1 0}}
.brand{text-decoration:none;margin-inline-end:auto;font-family:var(--name);font-size:1.45rem;font-weight:700;line-height:1.2;white-space:nowrap}
.brand small{font-family:var(--font);font-size:.95rem;font-weight:700}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.86rem;text-decoration:none;white-space:nowrap}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.lsw{display:inline-flex;height:40px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.lsw button{border:0;background:none;padding:0 12px;border-radius:999px;font:inherit;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer}
.lsw button.on{background:var(--acc);color:var(--acc-ink)}
@media (max-width:560px){.lsw button{padding:0 9px;font-size:.8rem}}
.hbtn.icon{width:40px;padding:0;justify-content:center}
.xpchip{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--acc)}
.xpchip small{color:var(--muted);font-weight:500}
.pf{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:.8rem;font-weight:700}
.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.menu::-webkit-scrollbar{display:none}
.menu a{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.93rem;font-weight:500;color:var(--muted);padding:7px 12px;border-radius:10px}
.menu a svg{width:18px;height:18px}
.menu a:hover{color:var(--ink);background:var(--surface-2)}
.menu a[aria-current="page"]{color:var(--acc);background:var(--acc-soft);font-weight:700}
@media (max-width:560px){.brand small{display:none}.hbtn .lbl{display:none}.hbtn.lang{width:40px;padding:0;justify-content:center}}

/* frame + hero */
.pat{background:var(--band)}
.frame{position:relative;border:1.5px solid var(--acc);outline:1px solid var(--acc);outline-offset:5px;background:var(--bg)}
.frame>i.c{position:absolute;width:12px;height:12px;background:var(--gold);transform:rotate(45deg);z-index:1}
.frame>i.c:nth-of-type(1){top:-8px;left:-8px}.frame>i.c:nth-of-type(2){top:-8px;right:-8px}.frame>i.c:nth-of-type(3){bottom:-8px;left:-8px}.frame>i.c:nth-of-type(4){bottom:-8px;right:-8px}
.hero{padding-block:40px}
.hero .frame{max-width:760px;margin:0 auto;text-align:center;padding:52px 24px 40px;border-radius:2px}
.kicker{font-size:.84rem;font-weight:600;color:var(--gold);letter-spacing:.06em}
html[lang="en"] .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem}
.hero h1{font-family:var(--name);margin:4px 0 6px;font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.6;color:var(--acc)}
.hero .en1{margin:0;font-size:1.05rem;color:var(--muted)}
.hadith{margin:22px auto 0;max-width:560px;font-family:var(--text);font-size:calc(1.3rem*var(--fs));line-height:2}
.hadith small{display:block;font-family:var(--font);font-size:.82rem;color:var(--muted);line-height:1.6}
.lead{margin:18px auto 0;max-width:520px;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;list-style:none;margin:28px auto 0;padding:0;opacity:.8}
.facts li{padding:0 10px;text-align:center;border-inline-start:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.facts li:first-child{border-inline-start:0}
.facts b{color:var(--ink);font-size:.82rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.92rem;text-decoration:none;border-radius:999px;padding:8px 16px;border:1.2px solid transparent;line-height:1.2;min-height:40px;background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.out{border-color:var(--acc);color:var(--acc);background:var(--surface)}
.btn.out:hover{background:var(--acc-soft)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sections */
.sec{padding-block:56px}
@media (max-width:560px){.sec{padding-block:36px}.lesson{padding:24px 18px;gap:20px}.panel{padding:18px}}
.sec+.sec{border-top:1px solid var(--line)}
.head{display:grid;gap:8px;margin-bottom:28px;max-width:720px}
h2{margin:0;font-weight:800;font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.4;text-wrap:balance}
h3{margin:0;font-size:1.02rem;font-weight:700}
.head p{margin:0;color:var(--muted)}
.prose{max-width:680px;font-size:1.03rem;line-height:1.95}
.prose p{margin:0 0 1em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:grid;gap:16px}
.stack{display:grid;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:.86rem;color:var(--muted);margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.tile{display:grid;gap:10px;align-content:start;padding:22px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--acc)}
.tile .ic,.gcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.tile span:last-child{color:var(--muted);font-size:.92rem}
.refs{margin:0;padding-inline-start:1.2em;font-family:var(--text);font-size:1.12rem;line-height:1.9}

/* today / stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.stats{gap:8px}.stat{padding:12px 6px}.stat b{font-size:1.15rem}.stat span{font-size:.76rem}}
.stat{background:var(--surface-2);border-radius:12px;padding:16px;display:grid;gap:2px;justify-items:center;text-align:center}
.stat svg{color:var(--acc)}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.84rem;color:var(--muted)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--empty) 0);display:grid;place-items:center}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.2}
.ring b{font-size:1.4rem}
.ring small{font-size:.75rem;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--empty);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days i{width:18px;height:18px;border-radius:4px;background:var(--empty)}
.days i.on{background:var(--acc)}
.days i.today{outline:2px solid var(--gold);outline-offset:1px}

/* chips, segmented */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.9rem;font-weight:600;min-height:36px}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;background:var(--band);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:10px;min-height:40px;padding:4px 10px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.7}
.pill.new{background:var(--surface-2);color:var(--muted)}
.pill.learning{background:var(--gold-soft);color:var(--gold)}
.pill.memorized{background:var(--ok-soft);color:var(--ok)}
.pill.review{background:var(--warn-soft);color:var(--warn)}

/* set cards */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.setc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.setc:hover{border-color:var(--acc)}
.setc .n{grid-row:span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--acc);font-weight:800}
.setc .t{font-weight:700}
.setc .r{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.setc .s{font-family:var(--name);font-size:1.05rem;color:var(--muted);grid-column:2/4;line-height:1.6;direction:rtl;text-align:start}
.setc .prog{grid-column:1/4;margin-top:6px}
.setc.on{border-color:var(--acc);background:var(--acc-soft)}

/* lesson card */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px clamp(20px,5vw,44px);display:grid;gap:24px}
.lesson.framed{border:1.5px solid var(--acc);outline:1px solid var(--acc);outline-offset:4px;border-radius:2px;box-shadow:none;margin:6px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}

const MEAN_EN=[["He is the One who is worshipped (al-maʾlūh), the One who alone deserves worship, with no partner in it."], ["He is the One who nurtures all His servants by managing their affairs and with every kind of blessing. More special than this is His nurturing of His close friends (awliyāʾ), by setting right their hearts, their souls and their character."], ["Ar-Raḥmān: the One with vast mercy that covers all of creation.", "Ar-Raḥīm: the One whose name includes the special mercy He has for His believing servants."], ["That is: all of creation are His possessions and His servants, and they all need Him. No one can leave His dominion."], ["Al-Ḥayy: the One with perfect life, who never dies.", "Al-Qayyūm: the One who stands by Himself and needs no one else, and who sustains everything else, so all of them need Him."], ["The One who is unique in His essence, His attributes, His lordship and His right to be worshipped. He has no partner and no equal, blessed and exalted is He."], ["He is the One whom all creatures turn to in all their needs, their necessities and their situations, because of His absolute perfection in His essence, names, attributes and actions."], ["The Creator of everything, who shaped this creation in the most perfect way and the finest form."], ["The One who takes on the provision of all creatures. Their provision truly comes from Him, and anyone else is only a means."], ["That is: the One who guides and directs His servants to everything that benefits them and to keeping away what harms them.", "This is guidance by showing, pointing out and directing, and guidance by granting success (tawfīq) to do good and helping with it."], ["The One whose knowledge encompasses everything. Not even the weight of an atom on earth or in the heaven escapes His knowledge."], ["The One who has the highest wisdom in what He creates and what He commands. He creates nothing in vain, and legislates nothing without purpose."], ["He, the Exalted, hears all voices in all their different languages, and He hears all who ask, all who call on Him and all who worship Him."], ["The One who sees everything, however fine and small. Nothing on earth or in the heaven is hidden from His sight, and He sees who deserves reward or punishment, according to His wisdom and knowledge."], ["The One to whom all praise belongs, who is praised in His essence, names, attributes and actions."], ["Vast in His attributes and great in them, with many descriptions, all of them noble."], ["The One who is greater than everything, mightier than everything, more majestic and higher."], ["The One who has absolute highness over all creation, in His essence, His rank and His dominance. He, blessed and exalted is He, rose over the Throne, and He is free and far above every defect and shortcoming."], ["Al-Matīn: that is, the One of intense strength.", "Al-Qawiyy: the One whom nothing can defeat, whom no conqueror can overcome, and whose decree no one can turn back."], ["The Perfect, the Glorified, who is free of every attribute of deficiency and safe from every defect."], ["He is the One who confirmed the truth of His messengers with every sign, proof and miracle that shows they are truthful and that what they brought is true. He is also the One who gives safety to the fearful by granting them security, the opposite of making them afraid."], ["The One who sees hidden matters and the secrets of the hearts, whose knowledge encompasses everything. He watches over His creation, their deeds, their provision and their lifespans."], ["The One to whom all might belongs. No creature can ever reach Him or harm Him, all creation submits to Him, and it humbles itself before His greatness."], ["That is: He, blessed and exalted is He, is the Overpowering, high above everything. And with that, He mends the broken-hearted and makes the needy free of need."], ["The One who is far above evil, deficiency and defects, because of His greatness and His supreme majesty."], ["That is: He, blessed and exalted is He, has perfect power. By His power He brought all things into being, by His power He manages them, and by His power He turns the hearts and directs them however He wills and wants."], ["That is: the One who sees all things. He has heard every voice, seen everything that exists, and His knowledge encompasses everything. He bears witness for His servants and against them about what they have done."], ["The One who sees what the hearts hide, who has preserved all creatures and made them run in the best order and the most perfect management."], ["He knows His servants fully, He is enough for those who rely on Him, and He repays His servants for good and for evil, according to His wisdom and His knowledge of their deeds, the small and the great."], ["The One who preserves what He created, who protects His close friends from falling into sins and ruin, and who has recorded the servants' deeds and their reward."], ["He, the Exalted, encompasses His servants: with knowledge, so not even the weight of an atom escapes Him; with power, so nothing on earth or in the heaven can defeat Him; and with dominance, so they cannot escape Him or flee from Him."], ["Vast in attributes and descriptions, so much that no one can fully count His praise. He is as He has praised Himself."], ["The One who has power over everything, who preserves everything, and who keeps account of everything."], ["The Prophet ﷺ explained these names in a complete and clear way. He said:", "“You are the First, so there is nothing before You. You are the Last, so there is nothing after You. You are the Most High (aẓ-Ẓāhir), so there is nothing above You. You are the Most Near (al-Bāṭin), so there is nothing closer than You.” (Muslim 2713)"], ["The One who judges between His servants in this world and the Hereafter with His justice and fairness. He is just in how He manages and decrees things."], ["He is the Rich, in whose hand are the treasures of the heavens and the earth, and the treasures of this world and the Hereafter. He enriches all His creation in a general way, and He enriches His chosen servants with the knowledge of Him and the truths of faith that He pours into their hearts."], ["The One who rewards a small deed and forgives many slips. Whoever draws near to Him with some good deed, Allah draws nearer to him even more."], ["That is: He, blessed and exalted is He, no one can hold back what He gives, and no one can give what He holds back.", "And He, the Exalted, gives a great deal, and His giving covers all that exists."], ["He has abundant good and great benefit, and of everything He has the best and most excellent.", "Al-Akram is the superlative form from karam (generosity), which means abundant good, and no one is more worthy of that than Him, glorified is He."], ["He is the Truth in His essence, His attributes and His names. His word is true, His promise is true, and He establishes the truth even if the criminals hate it."], ["The One who is gentle with His believing servants, who brings them what is good for them through His gentleness and kindness, in ways they do not notice. So it carries the meaning of al-Khabīr (the All-Aware) and the meaning of ar-Raʾūf (the Most Kind)."], ["The One whose goodness, favour and giving cover all of creation. He, the Exalted, has always been and will always be described by goodness and giving, and known for favour and kindness."], ["Raʾfah is the highest level of mercy. In this world it is general for all creation, and in the Hereafter it is for some of them: His believing close friends and His God-fearing servants."], ["The One whose forbearance extends even to the people of disbelief, sin and disobedience. He holds back His punishment from falling on the wrongdoers right away. He gives them time so that they may repent, but He does not neglect them if they insist and continue in their transgression and do not turn back to Him."], ["The One who is enough for His creation, protecting them from every evil, harm and wrong. He, blessed and exalted is He, gives them what is enough for everything they need and cannot do without."], ["He is near to everyone through His knowledge, His power and His encompassing. And He has a special nearness to His believing servants, by granting them success, support and victory."], ["He is the One who answers, a general answering, all who call on Him, whoever they are, wherever they are, and in whatever state they are."], ["The One to whom all creatures submit, humbled before His might, His strength and His perfect power.", "And He is al-Qāhir, who subdues and humbles His creation and holds them as His servants, high above them."], ["That is: He, the Exalted, withholds provision and takes souls, and He extends provision and opens hearts, according to His wisdom and His mercy."], ["He gives gifts, favours and presents in abundance. He grants His servants from His great bounty, sends them blessing after blessing, and gives to them generously."], ["The One who has always been and will always be known for pardon, and described by forgiveness and overlooking the faults of His servants. All of them are in need of His pardon and His forgiveness."], ["The One who guides His servants to repent, makes the ways to repentance easy for them, then accepts it from them and forgives them."], ["The One who judges between His creation and rules between them, giving everyone their due right, and who opens for them the doors of mercy, provision and knowledge."], ["The One who has lit up the hearts of those who know Him with knowledge of Him and faith in Him, and has lit up their hearts with His guidance."], ["The One who loves His prophets, His messengers and their followers, and they love Him, so He is more beloved to them than anything else."], ["That is: He, blessed and exalted is He, is the Guardian of all His creation in a general way, and of His righteous close friends in a special way."], ["The One who has taken on helping His servants and has guaranteed support for His close friends and defending them. The one who is truly helped is whoever Allah helps, since the servants have no helper other than Him."], ["The One who repays and holds to account. Allah, majestic and exalted is He, will gather the first and the last on the Day of Resurrection, then repay them and hold them to account for the deeds they sent ahead in their worldly life: if good, then good; and if evil, then evil."], ["The One who remains after all creation has passed away. Everything other than Him will cease, and everyone besides Him will perish, and He, majestic and exalted is He, is the Ever-Living who does not die."], ["The One who manages the affairs of His creation with His knowledge, His perfect power and His all-embracing wisdom. Whoever takes Him as their trustee, He is enough for them. And He is al-Kafīl, glorified is He, who looks after the affairs of all creatures and guarantees their food and their provision."], ["The One of bounty and blessing, of generosity and honour, of favour and giving."], ["Perfect and holy, free of all deficiencies and defects."], ["The One from whom healing comes: healing of the hearts from doubts, uncertainties and other diseases of the heart, and healing of the bodies from illnesses and harm."], ["This bringing forward and putting back is either in creation (kawnī), such as placing some creatures before others and some after others, or in the religious law (sharʿī), such as how He favoured the prophets over the rest of creation, favoured some of them over others, and favoured some of His servants over others."], ["So Allah, blessed and exalted is He, is beautiful in His essence, His names, His attributes and His actions."], ["He, the Exalted, gives a great deal, His gifts are great, and His kindness is vast. He pours His giving on His servants, and all of them owe Him favour, while no one has any favour over Him."], ["The Generous who is too shy to turn away empty-handed anyone who seeks refuge in Him and calls on Him. And the Forbearing who covers His servants' faults in this world and gives them time to repent, and who covers the believers in the Hereafter, forgives them and has mercy on them."], ["The One who has full control and management of this universe, with no equal. He is the Master, to whom alone obedience must be given, with no partner."], ["So Allah, the Exalted, is gentle in His actions. He created all creatures gradually, step by step, according to His wisdom and gentleness, even though He is able to create them all at once, in a single moment."], ["Al-Witr points to the oneness of Allah, the obligation to single Him out (tawḥīd), and to worship Him alone."]]; /* English translation of each meaning, paragraph by paragraph */

const firstLetter=w=>(w.match(/^[«(﴿"]*.[ً-ٰٟۖ-ۭ]*/u)||[w])[0];
function words(text,lv,sp){
  if(!lv&&!sp)return esc(text);
  return text.split(/\s+/).map((w,i)=>{
    if(/^[:،؛.»«()\-–ۚۖۗ۝]+$/.test(w)||!lv)return`<span class="w">${esc(w)}</span>`;
    const hide=lv===1?i%3===1:lv===2?i%3!==0:true;
    if(!hide)return`<span class="w">${esc(w)}</span>`;
    if(lv===3){const f=firstLetter(w);return`<span class="w fl" data-h>${esc(f)}<span class="rest">${esc(w.slice(f.length))}</span></span>`}
    return`<span class="w h" data-h>${esc(w)}</span>`;
  }).join(" ");
}

const MIS={all(){return LS.get("mis."+PID,[])},save(a){LS.set("mis."+PID,a.slice(0,300))},
  add(m){const a=this.all();a.unshift(m);this.save(a)},del(id){this.save(this.all().filter(m=>m.id!==id))},
  title(m){return t(m.type==="wrong"?"misWrong":m.type==="missed"?"misMissed":"misExtra")},
  line(m,k,cl){return m.ctx.filter(x=>x[k]!=null).map(x=>x.b?`<span class="${cl}">${esc(x[k])}</span>`:esc(x[k])).join(" ")},
  card(m){const both=m.type==="wrong";
    return`<div class="misc" data-mid="${m.id}"><div class="mh"><button class="tag" data-mopen="${m.i}" title="${esc(t("practiceL"))}">${t("lessonN")} ${N(m.i+1)}</button><span class="mt">${this.title(m)}</span>
      <button class="pl" data-mplay="${m.id}" aria-label="${esc(t("playMine"))}" title="${esc(t("playMine"))}">${ic("play2")}</button><button class="del" data-mdel="${m.id}" aria-label="${esc(t("misDel"))}" title="${esc(t("misDel"))}">${ic("trash")}</button></div>
      ${both?`<div class="mline"><small>${t("expected")}</small><span class="tx" lang="ar">${this.line(m,"e","g")}</span><small>${t("recitedL")}</small><span class="tx" lang="ar">${this.line(m,"s","r")}</span></div>`
        :`<div class="mline one"><span class="tx" lang="ar">${m.type==="missed"?this.line(m,"e","r"):this.line(m,"s","r")}</span></div>`}</div>`},
  bind(root,redraw){$$("[data-mdel]",root).forEach(b=>b.onclick=()=>{this.del(b.dataset.mdel);toast(t("misDone"));redraw()});
    $$("[data-mopen]",root).forEach(b=>b.onclick=()=>{this.closeSheet();Mem.stopLive();Mem.open(+b.dataset.mopen)});

function buildQs(){const pool=qPool();if(!pool.length)return[];const order=shuffle([...pool]),kinds=Q.kind==="mixed"?["m2n","n2m","next"]:[Q.kind],qs=[];
  const others=(i,c)=>{const near=shuffle(c.filter(x=>x!==i)),far=shuffle(DATA.map((_,x)=>x).filter(x=>x!==i&&!near.includes(x)));return[...near,...far]};
  for(let n=0;n<Q.n;n++){const i=order[n%order.length];let k=kinds[n%kinds.length];if(k==="next"&&i===DATA.length-1)k="n2m";if(k==="m2n"&&SELF_NAMING.has(i))k="n2m";
    if(k==="next"){const a=i+1;qs.push({k,i,a,opts:shuffle([a,...others(a,[a-2,a+1,a+2,i-1].filter(x=>x>=0&&x<DATA.length&&x!==i)).slice(0,3)])})}
    else qs.push({k,i,a:i,opts:shuffle([i,...others(i,pool).filter(x=>!(k==="m2n"&&SELF_NAMING.has(x))).slice(0,3)])})}
  return shuffle(qs)}

const DB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open("asma-recs",1);r.onupgradeneeded=()=>r.result.createObjectStore("recs",{keyPath:"id"});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const x=db.transaction("recs",mode);const r=fn(x.objectStore("recs"));x.oncomplete=()=>res(r&&r.result);x.onerror=()=>rej(x.error)})},
 put(o){return this.tx("readwrite",s=>s.put(o)).catch(()=>{})},all(){return this.tx("readonly",s=>s.getAll()).then(a=>a||[]).catch(()=>[])},del(id){return this.tx("readwrite",s=>s.delete(id)).catch(()=>{})}};

async function keepForever(){try{if(navigator.storage&&navigator.storage.persist)return(await navigator.storage.persisted())||(await navigator.storage.persist())}catch(e){}return false}
const fmtT=s=>{s=Math.max(0,Math.round(s));return N(Math.floor(s/60))+":"+N(String(s%60).padStart(2,"0"))};
const fmtD=d=>{try{return new Date(d).toLocaleDateString(LANG==="ar"?"ar":"en",{year:"numeric",month:"short",day:"numeric"})}catch(e){return""}};
const Rec={mr:null,stream:null,chunks:[],t0:0,lesson:0,tick:null,
 async start(i){if(this.mr)return true;try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return false}
  try{this.mr=new MediaRecorder(this.stream)}catch(e){this.stream.getTracks().forEach(x=>x.stop());return false}
  this.chunks=[];this.lesson=i;this.t0=Date.now();this.mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};this.mr.start(1000);keepForever();return true},
 stop(){if(!this.mr)return Promise.resolve(null);const mr=this.mr;this.mr=null;clearInterval(this.tick);
  return new Promise(res=>{mr.onstop=async()=>{try{this.stream.getTracks().forEach(x=>x.stop())}catch(e){}const dur=(Date.now()-this.t0)/1000;if(!this.chunks.length||dur<1)return res(null);
   const type=mr.mimeType||"audio/webm";const o={id:String(Date.now()),pid:PID,lesson:this.lesson,date:Date.now(),dur,type,blob:new Blob(this.chunks,{type})};await DB.put(o);toast(t("recSaved"));res(o)};try{mr.stop()}catch(e){res(null)}})}};
const extOf=type=>/mp4|aac|m4a/.test(type)?"m4a":/ogg/.test(type)?"ogg":/mpeg/.test(type)?"mp3":"webm";
async function saveBlob(blob,name){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function recItem(r){return`<div class="rec"><div><b>${t("lessonN")} ${N(r.lesson+1)} · <span lang="ar" class="nmi">${esc(nm(r.lesson))}</span></b><div class="note">${fmtD(r.date)} · ${fmtT(r.dur||0)}</div></div>
  <div class="row"><button class="btn out sm" data-dl="${r.id}">${ic("save")}${t("saveFile")}</button><button class="btn sm" data-rdel="${r.id}">${ic("trash")}${t("del")}</button></div><audio controls preload="metadata" data-src="${r.id}"></audio></div>`}
async function bindRecs(root,after){const all=await DB.all();const by={};all.forEach(r=>by[r.id]=r);
  $$("audio[data-src]",root).forEach(a=>{const r=by[a.dataset.src];if(r)try{a.src=URL.createObjectURL(r.blob)}catch(e){}});
  $$("[data-dl]",root).forEach(b=>b.onclick=()=>{const r=by[b.dataset.dl];if(r)saveBlob(r.blob,`asma-${r.lesson+1}-${new Date(r.date).toISOString().slice(0,10)}.${extOf(r.type)}`)});
  $$("[data-rdel]",root).forEach(b=>b.onclick=async()=>{if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent=t("sure");setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=t("del")}},4000);return}
    await DB.del(b.dataset.rdel);toast(t("deleted"));after&&after()})}

/* ---------- backup file (progress + recordings), no account needed ---------- */
const b64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>res("");r.readAsDataURL(blob)});
const unb64=(s,type)=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
async function makeBackup(){const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("asma1."))ls[k]=localStorage.getItem(k)}}catch(e){}
  const recs=[];for(const r of await DB.all()){recs.push({id:r.id,pid:r.pid,lesson:r.lesson,date:r.date,dur:r.dur,type:r.type,data:await b64(r.blob)})}
  return new Blob([JSON.stringify({app:"asma-al-husna",v:1,date:Date.now(),ls,recs})],{type:"application/json"})}
async function restoreBackup(file){let o;try{o=JSON.parse(await file.text())}catch(e){return false}
  if(!o||o.app!=="asma-al-husna"||typeof o.ls!=="object")return false;
  try{Object.keys(localStorage).filter(k=>k.startsWith("asma1.")).forEach(k=>localStorage.removeItem(k));for(const k in o.ls)if(k.startsWith("asma1."))localStorage.setItem(k,o.ls[k])}catch(e){return false}
  for(const r of o.recs||[]){try{await DB.put({id:r.id,pid:r.pid,lesson:r.lesson,date:r.date,dur:r.dur,type:r.type,blob:unb64(r.data,r.type)})}catch(e){}}
  return true}

/* ---------- progress ---------- */
V.progress=el=>{
  const mem=memNames(),pct=Math.round(mem/TOTAL*100),lm=DATA.filter((_,i)=>status(i)==="memorized").length,rev=DATA.map((_,i)=>i).filter(i=>status(i)==="review");
  const days=[...Array(14).keys()].reverse().map(n=>{const d=new Date();d.setDate(d.getDate()-n);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return`<i class="${ST.days[k]?"on":""} ${n===0?"today":""}" title="${k}"></i>`}).join("");
  el.innerHTML=`<section class="sec"><div class="wrap narrow stack"><div class="head"><h2>${t("pgHead")}</h2></div>
    <div class="panel"><div class="row" style="gap:24px"><div class="ring" style="--p:${pct}"><div><b>${N(pct)}٪</b><small>${N(mem)} / ${N(TOTAL)}</small></div></div>
      <div class="stats" style="flex:1;min-width:240px"><div class="stat hue6">${ic("bolt")}<b>${N(ST.xp)}</b><span>${t("xp")} · ${t("level")} ${N(levelOf(ST.xp))}</span></div><div class="stat hue5">${ic("fire")}<b>${N(streak())}</b><span>${t("streak")}</span></div><div class="stat hue1">${ic("check")}<b>${N(lm)} / ${N(DATA.length)}</b><span>${t("lessonsMem")}</span></div></div></div>
      <div><h3 style="margin-bottom:6px" class="hue3">${ic("cal")}${t("last14")}</h3><div class="days">${days}</div></div></div>
    <div class="panel"><h3 class="hue2">${ic("progress")}${t("bySet")}</h3>${Array.from({length:SETS},(_,k)=>{const r=setRange(k),d=r.filter(i=>status(i)==="memorized").length;return`<div style="display:grid;gap:4px"><div class="row" style="justify-content:space-between"><span>${setLabel(k)} <span class="note" lang="ar">${esc(setSpan(k))}</span></span><span class="note">${N(d)} / ${N(r.length)}</span></div><div class="prog ${hue(k)}"><i style="width:${d/r.length*100}%"></i></div></div>`}).join("")}</div>
    <div class="panel"><h3 class="hue6">${ic("list")}${t("revList")}</h3>${rev.length?`<ul class="misses">${rev.map(i=>`<li><span class="nm" lang="ar">${esc(nm(i))}</span><button class="btn out sm" data-st="${i}">${t("study")} · ${N(i+1)}</button></li>`).join("")}</ul>`:`<p class="note">${t("revEmpty")}</p>`}</div>
    <div class="panel"><div class="row" style="justify-content:space-between"><h3 class="hue5">${ic("memorize")}${t("myRecs")}</h3><button class="btn sm" id="delAll" hidden>${t("delAll")}</button></div><div class="recs" id="allRecs"></div></div>
  </div></section>`;
  $$("[data-st]").forEach(b=>b.onclick=()=>Mem.open(+b.dataset.st));
  const fill=async()=>{const box=$("#allRecs");if(!box)return;const all=(await DB.all()).filter(r=>r.pid===PID).sort((a,b)=>b.date-a.date);
    box.innerHTML=all.length?all.map(recItem).join(""):`<p class="note">${t("noRecs")}</p>`;$("#delAll").hidden=!all.length;bindRecs(box,fill)};
  fill();
  $("#delAll").onclick=async e=>{const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent=t("sure");return}
    for(const r of (await DB.all()).filter(r=>r.pid===PID))await DB.del(r.id);toast(t("deleted"));b.classList.remove("armed");b.textContent=t("delAll");fill()};
};

/* ---------- settings ---------- */
V.settings=el=>{
  const th=LS.get("theme","system");
  el.innerHTML=`<section class="sec"><div class="wrap narrow stack"><div class="head"><h2>${t("stHead")}</h2></div>
    <div class="panel">
      <div class="setrow"><b>${t("language")}</b><div class="seg"><button data-l="ar" class="${LANG==="ar"?"on":""}">العربية</button><button data-l="en" class="${LANG==="en"?"on":""}">English</button></div></div>
      <div class="setrow"><b>${t("theme")}</b><div class="seg">${["system","light","dark"].map(x=>`<button data-th="${x}" class="${th===x?"on":""}">${t(x)}</button>`).join("")}</div></div>
      <div class="setrow"><label for="fs"><b>${t("size")}</b></label><input id="fs" type="range" min="0.85" max="1.45" step="0.05" value="${LS.get("fs",1)}" style="accent-color:var(--acc)"></div>
      <div class="setrow"><div><b>${t("showEv")}</b><div class="note">${t("showEvD")}</div></div><label class="tog"><input type="checkbox" id="sEv" ${LS.get("showEv",true)?"checked":""}></label></div>
      <div class="setrow"><b>${t("target")}</b><div class="chips">${[3,5,7,10,20].map(n=>`<button class="chip ${LS.get("target",5)===n?"on":""}" data-tg="${n}">${N(n)}</button>`).join("")}</div></div>
    </div>
    <div class="panel"><h3 class="hue4">${ic("users")}${t("learners")}</h3><p class="note">${t("learnersD")}</p>
      ${PROFILES.map(p=>`<div class="learner"><button class="avb" data-av="${p.id}" aria-expanded="${AvOpen===p.id}" title="${esc(t("pickIcon"))}">${avatar(p,40)}<span class="avedit">${ic("edit")}</span></button><input data-pn="${p.id}" value="${esc(p.name)}" placeholder="${esc(t("name"))}" aria-label="${esc(t("name"))}">
        ${p.id===PID?`<span class="pill memorized">${t("current")}</span>`:`<button class="btn sm" data-use="${p.id}">${t("use")}</button><button class="btn sm warn" data-del="${p.id}">${t("del")}</button>`}</div>${AvOpen===p.id?avPicker(p):""}`).join("")}
      <div class="row"><button class="btn out sm" id="addL">${t("addLearner")}</button></div></div>
    <div class="panel"><h3 class="hue3">${ic("shield")}${t("storage")}</h3><p class="note">${t("storageD")}</p><p class="note" id="pst"></p>
      <div class="row"><button class="btn out sm" id="persist" hidden>${t("persistBtn")}</button><button class="btn pri sm" id="bk">${ic("save")}${t("backup")}</button><button class="btn out sm" id="rsBtn">${ic("upload")}${t("restore")}</button><input type="file" id="rsFile" accept="application/json,.json" hidden></div><div id="rcf"></div></div>
    ${LS.get("owner",false)?`<div class="panel"><h3 class="hue4">${ic("progress")}${t("ownV")}</h3><p class="note">${t("ownVD")}</p><div class="stats" id="ownv"><p class="note">…</p></div><div class="row"><button class="btn out sm" id="ownR">${ic("refresh")}${t("ownR")}</button><button class="btn sm" id="ownH">${t("ownH")}</button></div></div>`:""}
    <div class="panel"><div class="row"><button class="btn warn" id="rst">${t("resetP")}</button></div><div id="cf"></div></div>
  </div></section>`;
  const showP=async()=>{const on=await persisted();const el=$("#pst");if(!el)return;el.textContent=on?t("persistOn"):t("persistOff")+" "+t("persistWhat");$("#persist").hidden=on};showP();
  if($("#ownv")){const load=async()=>{const box=$("#ownv");box.innerHTML=`<p class="note">…</p>`;
      const get=async k=>{const r=await fetch(`https://${GOAT}.goatcounter.com/counter/${encodeURIComponent(k)}.json`,{cache:"no-store"});if(!r.ok)throw r.status;const d=await r.json();return String(d.count).replace(/[\s,\u202f\u00a0]/g,"")};
      try{const [here,all]=await Promise.all([get(location.pathname),get("TOTAL")]);if(!box.isConnected)return;
        box.innerHTML=`<div class="stat hue4">${ic("home")}<b>${N(+here||0)}</b><span>${t("ownHere")}</span></div><div class="stat hue2">${ic("progress")}<b>${N(+all||0)}</b><span>${t("ownAll")}</span></div>`}
      catch(e){if(box.isConnected)box.innerHTML=`<p class="note">${e===404?t("ownNone"):t("ownErr")}</p>`}};
    load();$("#ownR").onclick=load;$("#ownH").onclick=()=>{LS.set("owner",false);render()}}
  $("#persist").onclick=async()=>{const b=$("#persist");b.disabled=true;const ok=await keepForever();b.disabled=false;
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    const app=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
    const msg=ok?t("persistYes"):ios&&!app?t("persistIOS"):t("persistNo");
    const el=$("#pst");if(el){el.textContent=msg;el.classList.toggle("okn",!!ok);el.classList.toggle("warnn",!ok)}
    toast(t(ok?"persistYesT":"persistNoT"));if(el)el.scrollIntoView({block:"center",behavior:"smooth"});if(ok)b.hidden=true};
  $("#bk").onclick=async()=>{const b=$("#bk");b.disabled=true;b.textContent=t("working");keepForever();const blob=await makeBackup();await saveBlob(blob,`asma-backup-${today()}.json`);b.disabled=false;b.textContent=t("backup")};
  $("#rsBtn").onclick=()=>$("#rsFile").click();
  $("#rsFile").onchange=e=>{const f=e.target.files[0];if(!f)return;$("#rcf").innerHTML=`<div class="confirm"><p class="note" style="color:var(--ink)">${t("restoreQ")}</p><div class="row"><button class="btn warn" id="ry">${t("restore")}</button><button class="btn sm" id="rn">${t("cancel")}</button></div></div>`;
    $("#rn").onclick=()=>{$("#rcf").innerHTML="";e.target.value=""};
    $("#ry").onclick=async()=>{if(await restoreBackup(f)){toast(t("restored"));setTimeout(()=>location.reload(),600)}else{$("#rcf").innerHTML=`<p class="note" style="color:var(--bad)">${t("badFile")}</p>`}e.target.value=""}};
  $$("[data-l]").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;LS.set("lang",LANG);applySettings();render()});
  $$("[data-th]").forEach(b=>b.onclick=()=>{LS.set("theme",b.dataset.th);applySettings();render()});
  $("#sEv").onchange=e=>setEv(e.target.checked);
  $("#fs").oninput=e=>{LS.set("fs",+e.target.value);applySettings()};
  $$("[data-tg]").forEach(b=>b.onclick=()=>{LS.set("target",+b.dataset.tg);render()});
  bindAv(el);
  $$("[data-pn]").forEach(inp=>inp.onchange=()=>{PROFILES.find(p=>p.id===inp.dataset.pn).name=inp.value.trim().slice(0,24);LS.set("profiles",PROFILES);render()});
  $$("[data-use]").forEach(b=>b.onclick=()=>{PID=b.dataset.use;LS.set("pid",PID);loadST();Mem.stopLive();Mem.run=false;Q.qs=null;render()});
  $$("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;PROFILES=PROFILES.filter(p=>p.id!==id);LS.set("profiles",PROFILES);try{localStorage.removeItem("asma1.p."+id);localStorage.removeItem("asma1.mis."+id)}catch(e){}DB.all().then(a=>a.filter(r=>r.pid===id).forEach(r=>DB.del(r.id)));render()});
  $("#addL").onclick=()=>{const id="p"+Date.now().toString(36);PROFILES.push({id,name:"",color:PROFILES.length});AvOpen=id;LS.set("profiles",PROFILES);PID=id;LS.set("pid",PID);loadST();Mem.stopLive();Mem.run=false;render()};
  $("#rst").onclick=()=>{$("#cf").innerHTML=`<div class="confirm"><p class="note" style="color:var(--ink)">${t("resetQ")}</p><div class="row"><button class="btn warn" id="y">${t("yes")}</button><button class="btn sm" id="n">${t("cancel")}</button></div></div>`;
    $("#y").onclick=()=>{ST={p:{},xp:0,days:{},best:{}};saveST();LS.set("cur."+PID,0);toast(t("erased"));render()};$("#n").onclick=()=>$("#cf").innerHTML=""};
};

applySettings();render();
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
